<script>
/* ===================== 手算資料集 ===================== */
const MINI={
  A:[34,41,38,45,30,36,43,37],
  G1:[41,38,45,36,40], G2:[30,33,28,35,31],
  G3:[[42,38,45,39],[31,28,34,30],[40,44,37,41]],
  XY:[[5.5,31],[6.2,35],[6.8,38],[7.1,40],[7.5,43],[8.2,47]],
  PP:[[58,52],[61,55],[49,47],[55,48],[62,53]],
  CT:[[12,8],[5,15]]
};
const F2=(v,d)=>(v===null||!isFinite(v))?'—':v.toFixed(d===undefined?2:d);

/* ===================== 深入：推導卡 ===================== */
function deriveEl(b){
  const box=E('div','derive');
  box.appendChild(E('div','derive-h',b.title));
  b.steps.forEach((s,i)=>{
    const row=E('div','dstep');
    row.appendChild(E('div','dn',String(i+1)));
    const c=E('div','dc');
    if(s.m)c.appendChild(E('div','dm',s.m));
    if(s.w)c.appendChild(E('div','dw',s.w));
    row.appendChild(c); box.appendChild(row);
  });
  return box;
}
function secEl(b){
  const d=E('div','sec');
  d.appendChild(E('span','st',b.label));
  d.appendChild(E('span','sl'));
  return d;
}

/* ===================== 手算表 ===================== */
const HANDS={};
function handEl(k){const f=HANDS[k];return f?f():E('div');}
function handBox(title,sub,inner,foot){
  const box=E('div','out');
  box.appendChild(E('div','out-head','<span>'+title+'</span><span>'+(sub||'')+'</span>'));
  const w=E('div','tbl-wrap'); w.innerHTML=inner; box.appendChild(w);
  if(foot&&foot.length){const r=E('div','read');
    foot.forEach(([a,b])=>{const row=E('div','read-row');row.appendChild(E('span','read-key',a));
      row.appendChild(E('span',null,b));r.appendChild(row);});box.appendChild(r);}
  return box;
}

HANDS.sd=()=>{
  const a=MINI.A, n=a.length, m=S.mean(a);
  const rows=a.map((x,i)=>[i+1,x,F2(x-m),F2((x-m)*(x-m),3)]);
  const ss=S.sum(a.map(x=>(x-m)*(x-m)));
  rows.push(['<b>Σ</b>','<b>'+S.sum(a)+'</b>','<b>'+F2(S.sum(a.map(x=>x-m)),3)+'</b>','<b>'+F2(ss,3)+'</b>']);
  return handBox('手算：變異數與標準差','8 位受試者的記憶分數',
    '<table>'+TH(['#','X','X − M','(X − M)²'],[0,1,2,3])+TR(rows,[0,1,2,3])+'</table>',
    [['M','ΣX ÷ n = '+S.sum(a)+' ÷ '+n+' = <b>'+F2(m)+'</b>'],
     ['檢查','第三欄的總和一定是 0（在捨入誤差內）。這是平均數的定義性質，也是最快的自我檢查。'],
     ['SS','Σ(X − M)² = <b>'+F2(ss,3)+'</b>　這就是「離差平方和」，之後 ANOVA 和迴歸會一直看到它。'],
     ['s²','SS ÷ (n − 1) = '+F2(ss,3)+' ÷ '+(n-1)+' = <b>'+F2(S.variance(a),4)+'</b>'],
     ['s','√s² = <b>'+F2(S.sd(a),4)+'</b>'],
     ['對照','若誤用母體公式 SS ÷ n = '+F2(ss/n,4)+'，標準差會變成 '+F2(Math.sqrt(ss/n),4)+
      '，比正確值小了 '+F2((1-Math.sqrt(ss/n)/S.sd(a))*100,1)+'%。n 越小差越多。']]);
};
HANDS.quartile=()=>{
  const a=S.sortAsc(MINI.A), n=a.length;
  const pos=p=>(n-1)*p;
  const rows=[['Q1 (p = .25)',F2(pos(.25),2),'第 '+(Math.floor(pos(.25))+1)+' 與第 '+(Math.ceil(pos(.25))+1)+' 個之間',F2(S.quantile(a,.25),3)],
    ['Mdn (p = .50)',F2(pos(.5),2),'第 '+(Math.floor(pos(.5))+1)+' 與第 '+(Math.ceil(pos(.5))+1)+' 個之間',F2(S.quantile(a,.5),3)],
    ['Q3 (p = .75)',F2(pos(.75),2),'第 '+(Math.floor(pos(.75))+1)+' 與第 '+(Math.ceil(pos(.75))+1)+' 個之間',F2(S.quantile(a,.75),3)]];
  return handBox('手算：四分位數與盒鬚圖的鬍鬚','先排序：'+a.join('、'),
    '<table>'+TH(['統計量','位置 (n−1)p','落在哪兩個值之間','結果'],[1,3])+TR(rows,[1,3])+'</table>',
    [['位置公式','Excel 的 <code>QUARTILE.INC</code> 用 (n − 1)p 當「從 0 起算的位置」，非整數就在相鄰兩值之間做線性內插。'],
     ['IQR','Q3 − Q1 = '+F2(S.quantile(a,.75),3)+' − '+F2(S.quantile(a,.25),3)+' = <b>'+F2(S.quantile(a,.75)-S.quantile(a,.25),3)+'</b>'],
     ['離群值界線','下界 Q1 − 1.5×IQR = '+F2(S.quantile(a,.25)-1.5*(S.quantile(a,.75)-S.quantile(a,.25)),3)+
      '；上界 Q3 + 1.5×IQR = '+F2(S.quantile(a,.75)+1.5*(S.quantile(a,.75)-S.quantile(a,.25)),3)+
      '。這組資料沒有任何一筆落在界線外，所以盒鬚圖不會有離群點。'],
     ['注意','SPSS 預設用的是另一種分位數演算法（Tukey hinges），Q1／Q3 可能和 Excel 差一點點。這不是誰算錯，是定義不同。']]);
};
HANDS.z=()=>{
  const a=MINI.A, m=S.mean(a), s=S.sd(a);
  const rows=a.map(x=>[x,F2(x-m),F2((x-m)/s,3),F2(S.pnorm((x-m)/s)*100,1)+'%']);
  return handBox('手算：把原始分數轉成 z','M = '+F2(m)+'　SD = '+F2(s,3),
    '<table>'+TH(['X','X − M','z','常態下的百分等級'],[0,1,2,3])+TR(rows,[0,1,2,3])+'</table>',
    [['公式','z = (X − M) ÷ SD。分子告訴你「離平均多遠」，除以 SD 把它換算成「幾個標準差」。'],
     ['自我檢查','所有 z 的平均一定是 0，標準差一定是 1：實際算出來是 M<sub>z</sub> = '+
      F2(S.mean(a.map(x=>(x-m)/s)),6)+'，SD<sub>z</sub> = '+F2(S.sd(a.map(x=>(x-m)/s)),6)+'。'],
     ['百分等級','最右欄是「假設母體常態」時的 PR。如果分配不常態，這一欄就不能這樣算——z 分數本身永遠成立，但把 z 翻成百分比需要常態假設。']]);
};
HANDS.se=()=>{
  const a=MINI.A, n=a.length, m=S.mean(a), s=S.sd(a), se=s/Math.sqrt(n), t=S.qt(.975,n-1);
  return handBox('手算：標準誤與 95% 信賴區間','同一組 8 筆資料',
    '<table>'+TR([
      ['n（樣本數）',n],['M（樣本平均數）',F2(m,4)],['s（樣本標準差）',F2(s,4)],
      ['√n',F2(Math.sqrt(n),4)],['SE = s ÷ √n','<b>'+F2(se,4)+'</b>'],
      ['df = n − 1',n-1],['t<sub>.975, '+(n-1)+'</sub>（臨界值）',F2(t,4)],
      ['誤差界限 = t × SE',F2(t*se,4)],
      ['95% CI 下界 = M − t×SE','<b>'+F2(m-t*se,3)+'</b>'],
      ['95% CI 上界 = M + t×SE','<b>'+F2(m+t*se,3)+'</b>']],[1])+'</table>',
    [['SE vs SD','SD = '+F2(s,3)+' 描述「這 8 個人彼此差多少」；SE = '+F2(se,3)+
      ' 描述「這個平均數有多不準」。兩者差了 √8 = '+F2(Math.sqrt(n),3)+' 倍。'],
     ['如果 n 變成 32','SE 會變成 '+F2(s/Math.sqrt(32),4)+'，剛好是現在的一半——樣本數變 4 倍，精確度才提升 2 倍。'],
     ['為什麼用 t 不用 z','母體 σ 未知、要用樣本 s 去估，多了一層不確定性，所以臨界值要比 1.96 大一點。n = 8 時是 '+
      F2(t,3)+'，n = 60 時降到 '+F2(S.qt(.975,59),3)+'，n → ∞ 時趨近 1.96。']]);
};
HANDS.t1=()=>{
  const a=MINI.A, n=a.length, m=S.mean(a), s=S.sd(a), mu=40;
  const r=S.tTest1(a,mu);
  return handBox('手算：單一樣本 t 檢定','H₀：母體平均數 = 40 分',
    '<table>'+TR([
      ['① 樣本平均數 M',F2(m,4)],['② 虛無假設的值 μ₀',mu],
      ['③ 差異 M − μ₀','<b>'+F2(m-mu,4)+'</b>'],
      ['④ 樣本標準差 s',F2(s,4)],['⑤ 標準誤 SE = s/√n',F2(r.se,4)],
      ['⑥ t = ③ ÷ ⑤','<b>'+F2(r.t,4)+'</b>'],
      ['⑦ df = n − 1',r.df],
      ['⑧ 雙尾臨界值 t<sub>.975</sub>','±'+F2(S.qt(.975,r.df),4)],
      ['⑨ p 值（雙尾）','<b>'+fpBare(r.p)+'</b>'],
      ['⑩ Cohen\'s d = ③ ÷ ④',F2(r.d,3)]],[1])+'</table>',
    [['判斷','|t| = '+F2(Math.abs(r.t),3)+(Math.abs(r.t)>S.qt(.975,r.df)?' 大於':' 小於')+'臨界值 '+
      F2(S.qt(.975,r.df),3)+'，所以'+(r.p<.05?'拒絕':'無法拒絕')+' H₀。'],
     ['兩條路同一個答案','比臨界值、或比 p 值與 .05，一定得到同樣的結論。臨界值法是電腦普及前的作法，p 值法是現在的慣例。'],
     ['分子分母在幹嘛','分子 '+F2(m-mu,3)+' 是「效果」；分母 '+F2(r.se,3)+
      ' 是「如果 H₀ 為真，平均數本來就會有的隨機浮動」。t 就是在問：這個效果是那個浮動的幾倍？']]);
};
HANDS.tind=()=>{
  const a=MINI.G1,b=MINI.G2,n1=a.length,n2=b.length;
  const m1=S.mean(a),m2=S.mean(b),v1=S.variance(a),v2=S.variance(b);
  const sp2=((n1-1)*v1+(n2-1)*v2)/(n1+n2-2);
  const r=S.tTestInd(a,b);
  return handBox('手算：獨立樣本 t 檢定','甲組 '+a.join('、')+'　乙組 '+b.join('、'),
    '<table>'+TH(['','甲組','乙組'],[1,2])+TR([
      ['n',n1,n2],['M',F2(m1,3),F2(m2,3)],['s',F2(Math.sqrt(v1),3),F2(Math.sqrt(v2),3)],
      ['s²（變異數）',F2(v1,4),F2(v2,4)],['SS = s²×(n−1)',F2(v1*(n1-1),3),F2(v2*(n2-1),3)]],[1,2])+'</table>'+
    '<table style="margin-top:-1px">'+TR([
      ['① 合併變異數 s²<sub>p</sub> = (SS₁+SS₂) ÷ (n₁+n₂−2)',F2(sp2,4)],
      ['② 合併標準差 s<sub>p</sub> = √s²<sub>p</sub>',F2(Math.sqrt(sp2),4)],
      ['③ 標準誤 SE = s<sub>p</sub>√(1/n₁ + 1/n₂)',F2(r.se,4)],
      ['④ 平均差 M₁ − M₂','<b>'+F2(m1-m2,3)+'</b>'],
      ['⑤ t = ④ ÷ ③','<b>'+F2(r.t,4)+'</b>'],
      ['⑥ df = n₁ + n₂ − 2',r.df],
      ['⑦ p（雙尾）','<b>'+fpBare(r.p)+'</b>'],
      ['⑧ Cohen\'s d = ④ ÷ ②','<b>'+F2(r.d,3)+'</b>']],[1])+'</table>',
    [['合併變異數在幹嘛','假設兩組母體變異數相同，那就該把兩組的資訊「合起來估一次」，而不是各估各的。權重是各自的 df，所以人多的組講話比較大聲。'],
     ['檢查','s²<sub>p</sub> = '+F2(sp2,4)+' 一定落在 '+F2(Math.min(v1,v2),4)+' 與 '+F2(Math.max(v1,v2),4)+' 之間。算出來跑到範圍外就是算錯了。'],
     ['d 的分母','Cohen\'s d 用的是 s<sub>p</sub>（合併標準差），不是 SE。用 SE 當分母會得到 t，那是完全不同的東西——這是初學最常犯的混淆。']]);
};
HANDS.tpair=()=>{
  const p=MINI.PP, d=p.map(x=>x[0]-x[1]), n=d.length;
  const r=S.tTestPaired(p.map(x=>x[0]),p.map(x=>x[1]));
  const rows=p.map((x,i)=>[i+1,x[0],x[1],d[i],F2(d[i]-S.mean(d),2),F2(Math.pow(d[i]-S.mean(d),2),3)]);
  rows.push(['<b>Σ</b>','','','<b>'+S.sum(d)+'</b>','<b>0.00</b>','<b>'+F2(S.sum(d.map(v=>Math.pow(v-S.mean(d),2))),3)+'</b>']);
  return handBox('手算：成對樣本 t 檢定','5 個人的焦慮前測與後測',
    '<table>'+TH(['#','前測','後測','D = 前−後','D − M<sub>D</sub>','(D − M<sub>D</sub>)²'],[0,1,2,3,4,5])+
    TR(rows,[0,1,2,3,4,5])+'</table>'+
    '<table style="margin-top:-1px">'+TR([
      ['① M<sub>D</sub> = ΣD ÷ n','<b>'+F2(r.mean,3)+'</b>'],
      ['② s<sub>D</sub> = √(Σ(D−M<sub>D</sub>)² ÷ (n−1))',F2(r.sdDiff,4)],
      ['③ SE = s<sub>D</sub> ÷ √n',F2(r.se,4)],
      ['④ t = ① ÷ ③','<b>'+F2(r.t,4)+'</b>'],
      ['⑤ df = n − 1',r.df],
      ['⑥ p（雙尾）','<b>'+fpBare(r.p)+'</b>'],
      ['⑦ d<sub>z</sub> = ① ÷ ②','<b>'+F2(r.dz,3)+'</b>']],[1])+'</table>',
    [['關鍵一步','把兩欄變成一欄 D，之後就完全是<b>單一樣本 t 檢定</b>（檢定 D 的平均是不是 0）。成對 t 沒有新公式。'],
     ['為什麼比較敏感','前測分數從 49 到 62，個別差異很大；但 D 只有 '+d.join('、')+
      '，變異小很多。個別差異被消掉了，分母就小，t 就大。'],
     ['錯用獨立樣本會怎樣','同一份資料用獨立樣本 t 檢定會得到 t = '+
      F2(S.tTestInd(p.map(x=>x[0]),p.map(x=>x[1])).t,3)+'，df = 8，p = '+
      fpBare(S.tTestInd(p.map(x=>x[0]),p.map(x=>x[1])).p)+'——檢定力白白流失。']]);
};
HANDS.anova=()=>{
  const g=MINI.G3, all=[].concat(...g), N=all.length, k=g.length, gm=S.mean(all);
  const a=S.anova1(g);
  const rows=g.map((x,i)=>[['甲','乙','丙'][i],x.join('、'),x.length,F2(S.mean(x),3),
    F2(S.mean(x)-gm,3),F2(x.length*Math.pow(S.mean(x)-gm,2),3),
    F2(S.sum(x.map(v=>Math.pow(v-S.mean(x),2))),3)]);
  rows.push(['<b>總計</b>','','<b>'+N+'</b>','<b>'+F2(gm,3)+'</b>','','<b>'+F2(a.ssb,3)+'</b>','<b>'+F2(a.ssw,3)+'</b>']);
  return handBox('手算：單因子變異數分析','三組各 4 人的記憶分數，總平均 = '+F2(gm,3),
    '<table>'+TH(['組','分數','n','M<sub>組</sub>','M<sub>組</sub>−M<sub>總</sub>','n(M<sub>組</sub>−M<sub>總</sub>)²','Σ(X−M<sub>組</sub>)²'],[2,3,4,5,6])+
    TR(rows,[2,3,4,5,6])+'</table>'+
    '<table style="margin-top:-1px">'+TH(['變異來源','SS','df','MS','F','p'],[1,2,3,4,5])+
    TR([['組間',F2(a.ssb,3),a.dfb,F2(a.msb,3),'<b>'+F2(a.F,3)+'</b>','<b>'+fpBare(a.p)+'</b>'],
      ['組內（誤差）',F2(a.ssw,3),a.dfw,F2(a.msw,3),'',''],
      ['總和',F2(a.sst,3),a.dfb+a.dfw,'','','']],[1,2,3,4,5])+'</table>',
    [['第六欄','把每組平均離總平均的距離平方，再乘上該組人數——人多的組偏離越多，貢獻越大。加總就是 SS<sub>組間</sub>。'],
     ['第七欄','每個人離「自己那組」平均的距離平方。加總就是 SS<sub>組內</sub>，也就是誤差。'],
     ['檢查','SS<sub>組間</sub> + SS<sub>組內</sub> = '+F2(a.ssb,3)+' + '+F2(a.ssw,3)+' = '+F2(a.sst,3)+
      '，應該剛好等於把全部 '+N+' 筆資料一起算的 Σ(X − M<sub>總</sub>)²。這是最好用的驗算。'],
     ['df','組間 df = k − 1 = '+a.dfb+'；組內 df = N − k = '+a.dfw+'；兩者相加 = N − 1 = '+(N-1)+'。'],
     ['η²','SS<sub>組間</sub> ÷ SS<sub>總</sub> = '+F2(a.eta2,4)+'，組別解釋了 '+F2(a.eta2*100,1)+'% 的變異。']]);
};
HANDS.chisq=()=>{
  const o=MINI.CT, c=S.chi2Test(o);
  const rows=[];
  o.forEach((r,i)=>r.forEach((v,j)=>{
    rows.push([['甲組','乙組'][i]+' × '+['通過','未通過'][j],v,F2(c.exp[i][j],2),
      F2(v-c.exp[i][j],2),F2(Math.pow(v-c.exp[i][j],2)/c.exp[i][j],4)]);}));
  rows.push(['<b>Σ</b>','<b>'+c.N+'</b>','<b>'+c.N+'</b>','<b>0.00</b>','<b>'+F2(c.x2,4)+'</b>']);
  return handBox('手算：卡方獨立性檢定','2 × 2 表：甲組 12/8，乙組 5/15',
    '<table>'+TH(['格子','觀察 O','期望 E','O − E','(O−E)²/E'],[1,2,3,4])+TR(rows,[1,2,3,4])+'</table>',
    [['期望次數','E = 列總和 × 欄總和 ÷ 總人數。例如甲組通過的期望 = '+c.rowT[0]+' × '+c.colT[0]+' ÷ '+c.N+
      ' = '+F2(c.exp[0][0],2)+'。意思是「如果組別和通過與否完全無關，這格應該有幾個人」。'],
     ['O − E 的總和','一定是 0（期望次數的邊際總和與觀察值相同），所以必須平方才不會互相抵消——和變異數的邏輯一模一樣。'],
     ['除以 E','同樣差 3 個人，在期望 5 的格子裡很嚴重，在期望 500 的格子裡微不足道。除以 E 就是在做這個標準化。'],
     ['df','(列數−1)(欄數−1) = (2−1)(2−1) = '+c.df+'。2×2 表只有 1 個自由度：四格裡只要知道一格，其餘三格就被邊際總和鎖死了。'],
     ['結果','χ²('+c.df+') = '+F2(c.x2,3)+', p '+fp(c.p)+"，Cramér's V = "+F2(c.v,3)+'。']]);
};
HANDS.r=()=>{
  const d=MINI.XY, x=d.map(p=>p[0]), y=d.map(p=>p[1]);
  const mx=S.mean(x),my=S.mean(y),sx=S.sd(x),sy=S.sd(y);
  const rows=d.map((p,i)=>[p[0],p[1],F2((p[0]-mx)/sx,3),F2((p[1]-my)/sy,3),F2((p[0]-mx)/sx*((p[1]-my)/sy),4)]);
  const zp=x.map((v,i)=>(v-mx)/sx*((y[i]-my)/sy));
  rows.push(['<b>M</b>','<b>'+F2(my,2)+'</b>','','','<b>Σ = '+F2(S.sum(zp),4)+'</b>']);
  rows[rows.length-1][0]='<b>'+F2(mx,2)+'</b>';
  const r=S.pearson(x,y);
  return handBox('手算：Pearson 相關係數','6 對「睡眠時數 / 記憶分數」',
    '<table>'+TH(['X 睡眠','Y 記憶','z<sub>X</sub>','z<sub>Y</sub>','z<sub>X</sub> × z<sub>Y</sub>'],[0,1,2,3,4])+
    TR(rows,[0,1,2,3,4])+'</table>',
    [['公式','r = Σ(z<sub>X</sub> z<sub>Y</sub>) ÷ (n − 1) = '+F2(S.sum(zp),4)+' ÷ '+(x.length-1)+
      ' = <b>'+F2(r.r,4)+'</b>'],
     ['為什麼是乘積','兩個 z 同號（同時高於平均或同時低於平均）時乘積為正；一高一低時為負。把所有人的乘積加起來，就是在數「同進同退」壓過「一進一退」多少。'],
     ['為什麼最大是 1','當 z<sub>X</sub> 恆等於 z<sub>Y</sub>（完全線性），Σz<sub>X</sub>z<sub>Y</sub> = Σz² = n − 1，除下去剛好是 1。r 不可能超過 1，超過就是算錯。'],
     ['r²','r² = '+F2(r.r2,4)+'，這 6 對資料裡睡眠解釋了記憶 '+F2(r.r2*100,1)+'% 的變異。'],
     ['t 檢定','t = r√((n−2)/(1−r²)) = '+F2(r.t,3)+'，df = '+r.df+'，p '+fp(r.p)+'。']]);
};
HANDS.reg=()=>{
  const d=MINI.XY, x=d.map(p=>p[0]), y=d.map(p=>p[1]);
  const mx=S.mean(x),my=S.mean(y);
  const rows=d.map((p,i)=>[p[0],p[1],F2(p[0]-mx,3),F2(p[1]-my,3),
    F2((p[0]-mx)*(p[1]-my),4),F2(Math.pow(p[0]-mx,2),4)]);
  const sp=S.sum(x.map((v,i)=>(v-mx)*(y[i]-my))), sxx=S.sum(x.map(v=>Math.pow(v-mx,2)));
  rows.push(['<b>M</b>','','','','<b>Σ = '+F2(sp,4)+'</b>','<b>Σ = '+F2(sxx,4)+'</b>']);
  rows[rows.length-1][0]='<b>'+F2(mx,3)+'</b>'; rows[rows.length-1][1]='<b>'+F2(my,3)+'</b>';
  const rg=S.regress(y,[x]);
  const fit=d.map(p=>[p[0],p[1],F2(rg.beta[0]+rg.beta[1]*p[0],3),F2(p[1]-(rg.beta[0]+rg.beta[1]*p[0]),3),
    F2(Math.pow(p[1]-(rg.beta[0]+rg.beta[1]*p[0]),2),4)]);
  fit.push(['','','','<b>Σ ≈ 0</b>','<b>SS<sub>殘差</sub> = '+F2(rg.ssr,4)+'</b>']);
  return handBox('手算：最小平方迴歸','同樣 6 對資料',
    '<table>'+TH(['X','Y','X−M<sub>X</sub>','Y−M<sub>Y</sub>','乘積','(X−M<sub>X</sub>)²'],[0,1,2,3,4,5])+
    TR(rows,[0,1,2,3,4,5])+'</table>'+
    '<table style="margin-top:-1px">'+TR([
      ['① SP = Σ(X−M<sub>X</sub>)(Y−M<sub>Y</sub>)',F2(sp,4)],
      ['② SS<sub>X</sub> = Σ(X−M<sub>X</sub>)²',F2(sxx,4)],
      ['③ 斜率 b = ① ÷ ②','<b>'+F2(rg.beta[1],4)+'</b>'],
      ['④ 截距 a = M<sub>Y</sub> − b·M<sub>X</sub>','<b>'+F2(rg.beta[0],4)+'</b>'],
      ['⑤ R²',F2(rg.r2,4)]],[1])+'</table>'+
    '<table style="margin-top:-1px">'+TH(['X','實際 Y','預測 Ŷ','殘差 Y−Ŷ','殘差²'],[0,1,2,3,4])+
    TR(fit,[0,1,2,3,4])+'</table>',
    [['迴歸式','Ŷ = '+F2(rg.beta[0],3)+' + '+F2(rg.beta[1],3)+'X'],
     ['為什麼是 SP/SS<sub>X</sub>','把 SSE = Σ(Y − a − bX)² 對 b 微分設為 0，解出來就是這個式子。下面的推導會一步步走一次。'],
     ['殘差的兩個性質','① 殘差總和為 0；② 殘差與 X 的相關為 0。這兩件事是最小平方法的<b>數學必然</b>，不是資料的性質——所以它們不能拿來當「模型很好」的證據。'],
     ['b 和 r 的關係','b = r × (s<sub>Y</sub> ÷ s<sub>X</sub>) = '+F2(S.pearson(x,y).r,4)+' × ('+
      F2(S.sd(y),3)+' ÷ '+F2(S.sd(x),3)+') = '+F2(S.pearson(x,y).r*S.sd(y)/S.sd(x),4)+'，和 ③ 一致。']]);
};
HANDS.power=()=>{
  const rows=[[.2,'小'],[.5,'中'],[.8,'大'],[1.0,''],[1.5,'']].map(([d,lab])=>{
    let n=5;while(n<4000&&S.powerT2(d,n)<.8)n++;
    return [F2(d,1)+(lab?'（'+lab+'）':''),n,2*n,F2(S.powerT2(d,20),3),F2(S.powerT2(d,50),3),F2(S.powerT2(d,100),3)];});
  return handBox('查表：要多少人才夠','獨立樣本 t 檢定，α = .05 雙尾，目標檢定力 .80',
    '<table>'+TH(['效果量 d','每組需要 n','總樣本數','n=20 的檢定力','n=50','n=100'],[1,2,3,4,5])+
    TR(rows,[1,2,3,4,5])+'</table>',
    [['最該記住的一行','d = 0.5 要<b>每組 64 人</b>。心理學大部分介入研究的真實效果就在 0.3–0.5 之間，所以 30 人一組的研究通常檢定力只有 .3–.5——連一半的機會都不到。'],
     ['非線性','d 從 0.8 掉到 0.2，需要的人數從 26 暴增到 394，是 15 倍。效果越小，代價越是急遽上升。'],
     ['怎麼用','寫研究計畫時：先從文獻找一個合理的 d（或想清楚「小到什麼程度我就不在乎了」），查這張表，那就是你的目標樣本數。倒過來做（收完資料再算檢定力）沒有意義。']]);
};
HANDS.eta=()=>{
  const g=MINI.G3, a=S.anova1(g);
  const t=S.tTestInd(MINI.G1,MINI.G2);
  return handBox('手算：各種效果量怎麼互換','用上面兩組手算資料',
    '<table>'+TH(['要換的東西','公式','代入','結果'],[3])+TR([
      ["t → Cohen's d",'d = t√(1/n₁ + 1/n₂)',F2(t.t,3)+'×√(1/5+1/5)',F2(t.t*Math.sqrt(1/5+1/5),3)],
      ['t → r','r = √(t²/(t²+df))','√('+F2(t.t*t.t,2)+'/('+F2(t.t*t.t,2)+'+8))',F2(Math.sqrt(t.t*t.t/(t.t*t.t+8)),3)],
      ['F → η²','η² = SS<sub>組間</sub>/SS<sub>總</sub>',F2(a.ssb,2)+'/'+F2(a.sst,2),F2(a.eta2,3)],
      ['F → ω²','ω² = (SS<sub>b</sub>−df<sub>b</sub>·MS<sub>w</sub>)/(SS<sub>總</sub>+MS<sub>w</sub>)','—',F2(a.omega2,3)],
      ['r → d','d = 2r/√(1−r²)','—',F2(2*.5/Math.sqrt(1-.25),3)+'（以 r = .5 為例）'],
      ['d → 重疊率','兩組分配重疊約','d = 0.8 時',F2((1-(2*S.pnorm(.8/2)-1))*100,0)+'%']],[3])+'</table>',
    [['為什麼要會換','讀文獻時常常只給 t 或 F，沒給效果量。會換算才能把不同研究放在同一把尺上比較，這也是做後設分析的第一步。'],
     ['η² vs ω²','η² 會高估母體效果（和 R² 一樣會被參數數量灌水）。ω² 是不偏版本，永遠比 η² 小一點；小樣本時差距明顯，這裡是 '+
      F2(a.eta2,3)+' vs '+F2(a.omega2,3)+'。'],
     ['d = 0.8 的真正意義','「大效果」聽起來很大，但兩組分配仍然重疊超過一半。統計上的大，跟生活中的「一看就知道不一樣」差很遠。']]);
};
HANDS.levene=()=>{
  const g=[MINI.G1,MINI.G2];
  const z=g.map(a=>{const md=S.median(a);return a.map(v=>Math.abs(v-md));});
  const lv=S.levene(g);
  const rows=g.map((a,i)=>[['甲組','乙組'][i],a.join('、'),F2(S.median(a),1),z[i].map(v=>F2(v,1)).join('、'),F2(S.mean(z[i]),3)]);
  return handBox('手算：Levene 變異數同質檢定','它其實只是「對絕對離差做一次 ANOVA」',
    '<table>'+TH(['組','原始分數','中位數','|X − 中位數|','平均'],[2,4])+TR(rows,[2,4])+'</table>'+
    '<table style="margin-top:-1px">'+TR([['F',F2(lv.F,4)],['df₁, df₂',lv.df1+', '+lv.df2],
      ['p','<b>'+fpBare(lv.p)+'</b>']],[1])+'</table>',
    [['原理','如果兩組的散布程度一樣，那麼「每個人離自己組中心多遠」的平均也該一樣。把這些距離當成新的依變項跑 ANOVA，就是 Levene 檢定。'],
     ['為什麼用中位數','原始的 Levene 用平均數，但對偏斜資料太敏感。改用中位數（Brown-Forsythe 版本）穩健得多，SPSS 與 JASP 現在都預設報這一版。'],
     ['結論','p '+fp(lv.p)+(lv.p<.05?'，變異數不同質，改用 Welch。':'，沒有證據說兩組變異數不同，Student 與 Welch 都可以用。')],
     ['別過度解讀','Levene 本身也是個檢定，一樣受樣本數影響：n 很大時一點點差異就顯著，n 很小時差很多也可能不顯著。這是「一律用 Welch」這個建議背後的理由。']]);
};
HANDS.inter=()=>{
  const cells=[0,1,2].map(g=>[0,1].map(s=>DATA.filter(r=>r.group===g&&r.sex===s).map(r=>r.mem)));
  const a=S.anova2(cells,3,2);
  const cm=cells.map(r=>r.map(c=>S.mean(c)));
  const rowM=cm.map(r=>S.mean(r)), colM=[0,1].map(j=>S.mean(cm.map(r=>r[j])));
  const gm=S.mean([].concat(...cm));
  const rows=cm.map((r,i)=>[GN[i],F2(r[0],2),F2(r[1],2),F2(rowM[i],2),F2(rowM[i]-gm,2)]);
  rows.push(['<b>欄平均</b>','<b>'+F2(colM[0],2)+'</b>','<b>'+F2(colM[1],2)+'</b>','<b>'+F2(gm,2)+'</b>','']);
  const res=cm.map((r,i)=>r.map((v,j)=>v-rowM[i]-colM[j]+gm));
  return handBox('手算：交互作用到底在算什麼','每格 n = 10，用本課程資料的細格平均',
    '<table>'+TH(['組別','女','男','列平均','列效果'],[1,2,3,4])+TR(rows,[1,2,3,4])+'</table>'+
    '<table style="margin-top:-1px">'+TH(['組別','女的殘餘','男的殘餘','說明'],[1,2])+
    TR(cm.map((r,i)=>[GN[i],F2(res[i][0],3),F2(res[i][1],3),
      Math.abs(res[i][0])<.5?'接近 0，這一列沒有交互作用':'偏離 0，這一列就是交互作用的來源']),[1,2])+'</table>',
    [['殘餘怎麼算','細格平均 − 列平均 − 欄平均 + 總平均。意思是「把兩個主要效果都扣掉之後，這一格還剩下多少沒被解釋」。'],
     ['交互作用 SS','SS<sub>A×B</sub> = n × Σ(殘餘)² = 10 × '+F2(S.sum(res.flat().map(v=>v*v)),3)+' = '+
      F2(a.AB.ss,2)+'，正好等於前面 ANOVA 表裡的交互作用 SS。'],
     ['殘餘的性質','每一列的殘餘加起來是 0，每一欄也是 0。所以 3×2 設計只有 (3−1)(2−1) = 2 個自由度——這就是交互作用 df 的來源。'],
     ['讀出結論','睡眠限制組的殘餘最大（女 '+F2(res[1][0],2)+'、男 '+F2(res[1][1],2)+
      '），代表交互作用幾乎全部來自這一組：睡眠限制對男生特別傷。']]);
};

const GEOMS={};
function geomEl(k,cap){
  const box=E('div','sim');
  const hd=E('div','sim-head'); hd.appendChild(E('h4',null,GEOMS[k].title));
  if(cap)hd.appendChild(E('span','hint',cap)); box.appendChild(hd);

GEOMS.varsq={title:'變異數就是「平均的正方形面積」',build(body){
  let pts=[30,34,36,41,45], show=true;
  const ch=canvasIn(body,.55,(ctx,w,h)=>{
    const m=S.mean(pts);
    const f=frame(ctx,w,h,{xd:[24,52],yd:[0,1],padB:28,padT:14,padL:16,padR:16,
      xticks:[25,30,35,40,45,50],yticks:[]});
    const C=f.C, base=h-70, unit=(f.X(30)-f.X(24))/6;
    ctx.strokeStyle=C.rule2;ctx.beginPath();ctx.moveTo(f.X(24),base);ctx.lineTo(f.X(52),base);ctx.stroke();
    ctx.strokeStyle=C.s1;ctx.lineWidth=2;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(f.X(m),f.padT);ctx.lineTo(f.X(m),base+8);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=C.s1;ctx.font='500 11px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText('M = '+F2(m,1),f.X(m),f.padT+1);
    pts.forEach(v=>{
      const d=v-m, side=Math.abs(d)*unit;
      if(show&&side>1){
        const x0=Math.min(f.X(v),f.X(m));
        ctx.fillStyle=alpha(d>0?C.s2:C.s3,.2);
        ctx.fillRect(x0,base-side,side,side);
        ctx.strokeStyle=alpha(d>0?C.s2:C.s3,.75);ctx.lineWidth=1.2;
        ctx.strokeRect(x0,base-side,side,side);
        ctx.fillStyle=alpha(d>0?C.s2:C.s3,.95);ctx.font='10px "IBM Plex Mono",monospace';
        ctx.textAlign='center';ctx.textBaseline='middle';
        if(side>22)ctx.fillText(F2(d*d,1),x0+side/2,base-side/2);
      }
      ctx.strokeStyle=C.ink2;ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(f.X(v),base-2);ctx.lineTo(f.X(v),base+2);ctx.stroke();
      ctx.beginPath();ctx.arc(f.X(v),base,5.5,0,7);ctx.fillStyle=C.surface;ctx.fill();ctx.stroke();
    });
  });
  let drag=-1;
  const toV=e=>{const r=ch.c.getBoundingClientRect();
    return 24+((e.clientX-r.left)/r.width*ch.w-16)/(ch.w-32)*28;};
  ch.c.addEventListener('pointerdown',e=>{const v=toV(e);let bi=-1,bd=2.2;
    pts.forEach((p,i)=>{if(Math.abs(p-v)<bd){bd=Math.abs(p-v);bi=i;}});
    if(bi>=0){drag=bi;ch.c.setPointerCapture(e.pointerId);}});
  ch.c.addEventListener('pointermove',e=>{if(drag<0)return;
    pts[drag]=Math.max(25,Math.min(51,Math.round(toV(e))));redraw(ch);upd();});
  ch.c.addEventListener('pointerup',()=>drag=-1);
  ch.c.style.cursor='ew-resize';
  const S1=stats(body,[['M'],['SS = Σ 面積'],['s² = SS/(n−1)','hi'],['s = √s²']]);
  const upd=()=>{const m=S.mean(pts),ss=S.sum(pts.map(v=>(v-m)*(v-m)));
    S1.M.textContent=F2(m,2);S1['SS = Σ 面積'].textContent=F2(ss,2);
    S1['s² = SS/(n−1)'].textContent=F2(S.variance(pts),3);S1['s = √s²'].textContent=F2(S.sd(pts),3);};
  upd();
  body.appendChild(E('p','calc-note','每個點到平均數的距離，被畫成一個正方形。<b>變異數就是這些正方形的平均面積</b>（除以 n−1 而不是 n），標準差則是把那個平均面積開根號，變回一段長度。拖動任何一個點，看正方形怎麼長大——離得越遠，面積增加得越快（平方的代價）。'));
  btnRow(body,[['顯示／隱藏正方形',function(){show=!show;redraw(ch);},true],
    ['重設',()=>{pts=[30,34,36,41,45];redraw(ch);upd();},true],
    ['製造一個極端值',()=>{pts=[30,34,36,41,51];redraw(ch);upd();},true]]);
}};
GEOMS.sspart={title:'一個人的分數，可以拆成三段',build(body){
  const g=MINI.G3, all=[].concat(...g), gm=S.mean(all), a=S.anova1(g);
  let pick=[0,0];
  const ch=canvasIn(body,.5,(ctx,w,h)=>{
    const f=frame(ctx,w,h,{xd:[-.5,2.5],yd:[24,50],padB:32,padT:14,padL:36,
      xticks:[0,1,2],fxk:t=>['甲組','乙組','丙組'][t],yticks:[25,30,35,40,45,50],ylab:'分數'});
    const C=f.C, cols=[C.s1,C.s2,C.s3];
    ctx.strokeStyle=alpha(C.ink3,.8);ctx.lineWidth=1;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(f.X(-.5),f.Y(gm));ctx.lineTo(f.X(2.5),f.Y(gm));ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=C.ink3;ctx.font='10px "IBM Plex Mono",monospace';ctx.textAlign='left';ctx.textBaseline='bottom';
    ctx.fillText('總平均 '+F2(gm,2),f.X(-.45),f.Y(gm)-3);
    g.forEach((grp,i)=>{
      const gmean=S.mean(grp);
      ctx.strokeStyle=cols[i];ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(f.X(i-.3),f.Y(gmean));ctx.lineTo(f.X(i+.3),f.Y(gmean));ctx.stroke();
      grp.forEach((v,j)=>{
        const x=f.X(i+(j-1.5)*.13), sel=(pick[0]===i&&pick[1]===j);
        if(sel){
          ctx.strokeStyle=alpha(C.s2,.9);ctx.lineWidth=5;
          ctx.beginPath();ctx.moveTo(x,f.Y(gm));ctx.lineTo(x,f.Y(gmean));ctx.stroke();
          ctx.strokeStyle=alpha(C.ink2,.75);ctx.lineWidth=5;
          ctx.beginPath();ctx.moveTo(x,f.Y(gmean));ctx.lineTo(x,f.Y(v));ctx.stroke();
        }
        ctx.beginPath();ctx.arc(x,f.Y(v),sel?7:4.5,0,7);
        ctx.fillStyle=sel?cols[i]:alpha(cols[i],.45);ctx.fill();
        if(sel){ctx.strokeStyle=C.surface;ctx.lineWidth=2;ctx.stroke();}
      });
    });
  });
  ch.c.addEventListener('pointerdown',e=>{
    const r=ch.c.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*ch.w;
    const i=Math.max(0,Math.min(2,Math.round(-.5+(px-36)/(ch.w-48)*3)));
    const off=(px-36)/(ch.w-48)*3-.5-i;
    const j=Math.max(0,Math.min(3,Math.round(off/.13+1.5)));
    pick=[i,j];redraw(ch);upd();});
  ch.c.style.cursor='pointer';
  const S1=stats(body,[['這個人的分數'],['組平均'],['組間那段'],['組內那段'],['加起來']]);
  const upd=()=>{const v=g[pick[0]][pick[1]], gmean=S.mean(g[pick[0]]);
    S1['這個人的分數'].textContent=v;S1['組平均'].textContent=F2(gmean,2);
    S1['組間那段'].textContent=F2(gmean-gm,2);S1['組內那段'].textContent=F2(v-gmean,2);
    S1['加起來'].textContent=F2(v-gm,2);};
  upd();
  body.appendChild(E('p','calc-note','點任何一個資料點。<b>(X − 總平均) = (組平均 − 總平均) + (X − 組平均)</b>——橘色那段是「因為他在哪一組」，灰色那段是「因為他是他」。把所有人的兩段各自平方加總，就得到 SS<sub>組間</sub> 與 SS<sub>組內</sub>，而且兩者相加剛好等於 SS<sub>總</sub>（'+F2(a.ssb,2)+' + '+F2(a.ssw,2)+' = '+F2(a.sst,2)+'）。交叉項會完全消掉，這就是「變異可以被切開」的真正意思。'));
}};

    ctx.textAlign='left';ctx.fillText('乘積為正 +',f.X(-2.9),f.Y(-.15));
    ctx.fillStyle=alpha(C.s2,.9);ctx.fillText('乘積為負 −',f.X(-2.9),f.Y(2.9));
    ctx.textAlign='right';ctx.fillText('乘積為負 −',f.X(2.9),f.Y(-.15));
    pts.forEach(p=>{ctx.beginPath();ctx.arc(f.X(p[0]),f.Y(p[1]),4,0,7);
      ctx.fillStyle=alpha(p[0]*p[1]>0?C.s1:C.s2,.65);ctx.fill();});
  });
  const c=E('div','ctrls'); body.appendChild(c);
  slider(c,'產生資料的 r',-.95,.95,.05,r0,v=>v.toFixed(2),v=>{r0=v;pts=gen(v);redraw(ch);upd();});
  const S1=stats(body,[['實際 r','hi'],['正象限點數'],['負象限點數'],['Σ z·z ÷ (n−1)']]);
  const upd=()=>{const x=pts.map(p=>p[0]),y=pts.map(p=>p[1]),r=S.pearson(x,y);
    S1['實際 r'].textContent=F2(r.r,3);
    S1['正象限點數'].textContent=pts.filter(p=>p[0]*p[1]>0).length;
    S1['負象限點數'].textContent=pts.filter(p=>p[0]*p[1]<=0).length;
    S1['Σ z·z ÷ (n−1)'].textContent=F2(S.sum(pts.map(p=>p[0]*p[1]))/(pts.length-1),3);};
  upd();
  body.appendChild(E('p','calc-note','每個點的 z<sub>X</sub> × z<sub>Y</sub>：落在藍色象限的乘積為正，橘色象限為負。r 就是<b>所有乘積的平均</b>（除以 n−1）。把滑桿拉到 0，你會看到四個象限的點數差不多，正負互相抵消；拉到 .9，點幾乎全擠在藍色對角線上。這也解釋了為什麼倒 U 型關係的 r 會接近 0——四個象限剛好平均分布。'));
}};

/* ===================== 迷你試算表 ===================== */
function labEl(cfg,stageId){
  const headers=cfg.headers, rows=cfg.rows;
  const nCol=headers.length, nData=rows.length;
  const nOpen=(cfg.open||[]).length;
  const lblCol=nCol+nOpen+1, inCol=nCol+nOpen+2, totCol=nCol+nOpen+3;
  const tasks=cfg.tasks.map((t,i)=>Object.assign({},t,{cell:FX.colName(inCol)+(2+i)}));
  const nRow=Math.max(nData+1,tasks.length+2);

  const open=(cfg.open||[]).map((o,i)=>Object.assign({},o,{c:nCol+i}));
  const openCell={};
  open.forEach(o=>{for(let r=2;r<=nData+1;r++)openCell[FX.colName(o.c)+r]=o;});

  const book=FX.makeBook();
  const ref=FX.makeBook();
  const seed=bk=>{
    headers.forEach((h,c)=>bk.set(c,0,h));
    rows.forEach((r,i)=>r.forEach((v,c)=>bk.set(c,i+1,v)));
    tasks.forEach((t,i)=>bk.set(lblCol,1+i,t.c));
    open.forEach(o=>bk.set(o.c,0,o.label));
  };
  seed(book); seed(ref);
  open.forEach(o=>{if(o.a)for(let r=2;r<=nData+1;r++)ref.setRef(FX.colName(o.c)+r,o.a.replace(/\{r\}/g,r));});
  tasks.forEach(t=>ref.setRef(t.cell,t.a));
  const expect=tasks.map(t=>ref.valueRef(t.cell));

  /* 還原已存的作答 */
  const store=(PROG.lab&&PROG.lab[stageId])||{};
  Object.keys(store).forEach(k=>{if(/^[A-Z]+[0-9]+$/.test(k))book.setRef(k,store[k]);});

  const box=E('div','lab');
  const hd=E('div','lab-head');
  hd.appendChild(E('h4',null,cfg.title));
  hd.appendChild(E('span','hint',cfg.hint||'點右邊藍色的格子，輸入 Excel 公式'));
  box.appendChild(hd);

  const fbar=E('div','fbar');
  const fref=E('div','fref','—'), fval=E('div','fval','選一個格子');
  fbar.appendChild(fref); fbar.appendChild(fval); box.appendChild(fbar);

  const wrap=E('div','sheet-wrap'); const tb=E('table','sheet');
  const thead=E('thead'); const htr=E('tr'); htr.appendChild(E('th',null,''));
  for(let c=0;c<totCol;c++)htr.appendChild(E('th',null,FX.colName(c)));
  thead.appendChild(htr); tb.appendChild(thead);
  const tbody=E('tbody');
  const inputs={};
  for(let r=0;r<nRow;r++){
    const tr=E('tr'); tr.appendChild(E('th',null,String(r+1)));
    for(let c=0;c<totCol;c++){
      const td=E('td');
      const ref0=FX.colName(c)+(r+1);
      const isHdr=(r===0&&c<nCol), isData=(r>0&&r<=nData&&c<nCol), isLbl=(c===lblCol&&r>=1&&r<=tasks.length);
      const isOpenHdr=(r===0)&&open.some(o=>o.c===c);
      const task=tasks.find(t=>t.cell===ref0);
      if(isOpenHdr){td.className='hdr';td.textContent=open.find(o=>o.c===c).label;}
      else if(isHdr){td.className='hdr';td.textContent=headers[c];}
      else if(isData){td.textContent=rows[r-1][c];}
      else if(isLbl){td.className='lbl';td.textContent=tasks[r-1].c;}
      else if(openCell[ref0]){
        td.className='edit'; td.style.boxShadow='inset 0 0 0 1px var(--rule-2)';
        td.style.background='var(--surface)';
        const inp=document.createElement('input');
        inp.type='text'; inp.id='lab'+stageId+'-'+ref0; inp.spellcheck=false;
        inp.setAttribute('aria-label',ref0+' 輔助欄');
        inp.value=fmtCell(book.valueRef(ref0));
        inp.onfocus=()=>{inp.value=book.getRawRef(ref0)||'';selectCell(ref0);
          try{inp.setSelectionRange(0,inp.value.length);}catch(e){}};
        inp.onblur=()=>{commit(ref0,inp.value);inp.value=fmtCell(book.valueRef(ref0));};
        inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();inp.blur();}
          if(e.key==='Escape'){inp.value=book.getRawRef(ref0)||'';inp.blur();}};
        inputs[ref0]=inp; td.appendChild(inp);
      }
      else if(task){
        td.className='edit';
        const inp=document.createElement('input');
        inp.type='text'; inp.id='lab'+stageId+'-'+task.cell; inp.spellcheck=false;
        inp.setAttribute('aria-label',task.c+' 的公式');
        inp.value=fmtCell(book.valueRef(task.cell));
        inp.dataset.cell=task.cell;
        inp.onfocus=()=>{inp.value=book.getRawRef(task.cell)||'';selectCell(task.cell);
          try{inp.setSelectionRange(0,inp.value.length);}catch(e){}};
        inp.onblur=()=>{commit(task.cell,inp.value);inp.value=fmtCell(book.valueRef(task.cell));};
        inp.onkeydown=e=>{
          if(e.key==='Enter'){e.preventDefault();inp.blur();}
          if(e.key==='Escape'){inp.value=book.getRawRef(task.cell)||'';inp.blur();}};
        inp.oninput=()=>{fval.textContent=inp.value||'（空白）';};
        inputs[task.cell]=inp; td.appendChild(inp);
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  tb.appendChild(tbody); wrap.appendChild(tb); box.appendChild(wrap);

  function fmtCell(v){
    if(v===''||v===null||v===undefined)return '';
    if(FX.isErr(v))return v;
    if(typeof v==='number'){
      if(!isFinite(v))return '#NUM!';
      const av=Math.abs(v);
      if(av!==0&&(av<1e-4||av>=1e9))return v.toExponential(3);
      return String(Math.round(v*1e6)/1e6);
    }
    return String(FX.disp(v));
  }
  function selectCell(cell){fref.textContent=cell;fval.textContent=book.getRawRef(cell)||'（空白）';}
  function commit(cell,val){
    book.setRef(cell,val);
    if(!PROG.lab)PROG.lab={};
    if(!PROG.lab[stageId])PROG.lab[stageId]={};
    if(val)PROG.lab[stageId][cell]=val; else delete PROG.lab[stageId][cell];
    save();
    Object.keys(inputs).forEach(k=>{if(document.activeElement!==inputs[k])inputs[k].value=fmtCell(book.valueRef(k));});
    fval.textContent=val||'（空白）';
  }

  /* 任務清單 */
  const tl=E('div','tasks'); const cards=[];
  tasks.forEach((t,i)=>{
    const card=E('div','task');
    card.appendChild(E('span','tc',t.cell));
    const d=E('div','td',t.d); card.appendChild(d);
    const act=E('div','ta');
    const bChk=E('button','mini','檢查'); bChk.type='button'; bChk.onclick=()=>check(i,true);
    const bAns=E('button','mini','解答'); bAns.type='button';
    bAns.onclick=()=>{fillOpen();inputs[t.cell].value=t.a;commit(t.cell,t.a);
      inputs[t.cell].value=fmtCell(book.valueRef(t.cell));check(i,true,true);};
    act.appendChild(bChk); act.appendChild(bAns); card.appendChild(act);
    const msg=E('div','msg','　'); msg.hidden=true; card.appendChild(msg);
    cards.push({card,msg}); tl.appendChild(card);
  });
  box.appendChild(tl);

  function fillOpen(){
    open.forEach(o=>{if(!o.a)return;
      for(let r=2;r<=nData+1;r++){
        const rf=FX.colName(o.c)+r, f=o.a.replace(/\{r\}/g,r);
        if(inputs[rf]){inputs[rf].value=f;commit(rf,f);inputs[rf].value=fmtCell(book.valueRef(rf));}
      }});
  }
  function check(i,show,viaAnswer){
    const t=tasks[i], raw=String(book.getRawRef(t.cell)||'').trim();
    const {card,msg}=cards[i];
    card.classList.remove('solved','miss');
    const td=inputs[t.cell].parentElement; td.classList.remove('ok','bad');
    let ok=false, text='', blank=false;
    if(!raw){text='還沒作答。';blank=true;}
    else if(raw[0]!=='='){text='Excel 的公式要以 <b>=</b> 開頭，例如 <code>=AVERAGE(A2:A9)</code>。直接填數字不算，這一關要練的是公式。';}
    else{
      const v=book.valueRef(t.cell);
      const exp=expect[i];
      const miss=(t.need||[]).filter(fn=>raw.toUpperCase().indexOf(fn.toUpperCase())<0);
      if(FX.isErr(v))text='公式回傳 <b>'+v+'</b>。'+(v==='#NAME?'?'通常是函數名稱打錯，或這裡不支援這個函數。':
        v==='#DIV/0!'?'除以 0 了，檢查一下範圍是不是選錯。':v==='#VALUE!'?'括號或逗號可能少了一個。':'');
      else if(typeof exp==='number'){
        if(typeof v!=='number')text='算出來不是數字，而是「'+String(v)+'」。';
        else{
          const tol=t.tol||Math.max(1e-6,Math.abs(exp)*1e-6);
          if(Math.abs(v-exp)>tol)text='算出來是 <b>'+fmtCell(v)+'</b>，正確答案是 <b>'+fmtCell(exp)+'</b>。'+(t.hintWrong||'');
          else if(miss.length)text='數字對了，但這一題要練的是 <b>'+miss.join('、')+'</b> 函數，換成它再試一次。';
          else{ok=true;text=(viaAnswer?'這是解答：':'正確。')+(t.why||'');}
        }
      }
      else{
        if(String(v).trim()!==String(exp).trim())
          text='你的結果是<br><code>'+String(v)+'</code><br>正確答案是<br><code>'+String(exp)+'</code>'+(t.hintWrong||'');
        else if(miss.length)text='結果對了，但這一題要練的是 <b>'+miss.join('、')+'</b>，換成它再試一次。';
        else{ok=true;text=(viaAnswer?'這是解答：':'正確。')+(t.why||'');}
      }
    }
    msg.innerHTML=text; msg.hidden=false;
    if(!blank){card.classList.add(ok?'solved':'miss'); td.classList.add(ok?'ok':'bad');}
    return ok;
  }

  const foot=E('div','lab-foot');
  const stat=E('div','foot-note','完成 0 / '+tasks.length);
  const btns=E('div','foot-btns');
  const bAll=E('button','btn','檢查全部'); bAll.type='button';
  bAll.onclick=()=>{let n=0;tasks.forEach((t,i)=>{if(check(i,true))n++;});
    stat.textContent='完成 '+n+' / '+tasks.length+(n===tasks.length?'　全部答對了':'');};
  if(open.some(o=>o.a)){
    const bFill=E('button','btn ghost','填入輔助欄公式'); bFill.type='button';
    bFill.onclick=()=>{fillOpen();};
    var extraFill=bFill;
  }
  const bClear=E('button','btn ghost','清空'); bClear.type='button';
  bClear.onclick=()=>{Object.keys(inputs).forEach(k=>{inputs[k].value='';commit(k,'');});
    cards.forEach(c=>{c.card.classList.remove('solved','miss');c.msg.hidden=true;});
    Object.values(inputs).forEach(inp=>inp.parentElement.classList.remove('ok','bad'));
    stat.textContent='完成 0 / '+tasks.length;};
  btns.appendChild(bAll); if(typeof extraFill!=='undefined'&&extraFill)btns.appendChild(extraFill);
  btns.appendChild(bClear);
  foot.appendChild(stat); foot.appendChild(btns); box.appendChild(foot);

  const fl=E('details','fn-list');
  fl.appendChild(E('summary',null,'這個試算表支援哪些函數？（點開）'));
  const inner=E('div',null,FX.FUNCS.filter(f=>f.indexOf('.')<0||f.indexOf('.')>0).sort()
    .map(f=>'<code>'+f+'</code>').join(''));
  inner.style.marginTop='.4rem';
  fl.appendChild(inner);
  fl.appendChild(E('p','calc-note','用法和真的 Excel 一樣：範圍寫成 <code>A2:A9</code>，可以巢狀、可以四則運算、可以引用別的格子。算出來的值會即時更新。'));
  box.appendChild(fl);

  /* 若已有存檔，載入後先跑一次檢查 */
  if(Object.keys(store).length)setTimeout(()=>{let n=0;tasks.forEach((t,i)=>{
    if(String(book.getRawRef(t.cell)||'').trim()&&check(i,true))n++;});
    stat.textContent='完成 '+n+' / '+tasks.length;},0);
  return box;
}

/* 產生資料列 */
function labData(keys,n){
  const rows=(n?DATA.slice(0,n):DATA).map(r=>keys.map(k=>r[k]));
  return rows;
}
