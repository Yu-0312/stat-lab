<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="十六關的互動式統計學課程：公式推導、逐步手算、網頁內建的迷你 Excel 實作，並對照 JASP 與 SPSS 的操作。">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="睡眠研究統計教室">
<meta property="og:description" content="互動式統計學課程 — 推導、手算、網頁內 Excel 實作，Excel · JASP · SPSS 三軟體並行。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>睡眠研究統計教室</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --paper:#F3F6F5; --surface:#FFFFFF; --surface-2:#EAEFEF; --surface-3:#DFE7E7;
  --ink:#152329; --ink-2:#48606B; --ink-3:#7A8F99;
  --rule:#DCE4E4; --rule-2:#C4D1D2;
  --accent:#1B5E8C; --accent-2:#124460; --accent-soft:#E3EEF5; --on-accent:#FFFFFF;
  --signal:#B8500F; --signal-soft:#FAEBDF;
  --s1:#2D6CA2; --s2:#D1642B; --s3:#8A5AC2;
  --good:#2C6E52; --good-soft:#E2F0E9;
  --warn:#8E5B00; --warn-soft:#F8EFDC;
  --bad:#A8382C; --bad-soft:#F7E6E3;
  --grid:rgba(27,94,140,.07);
  --shadow:0 1px 2px rgba(21,35,41,.05),0 6px 20px -12px rgba(21,35,41,.28);
  --font-display:"IBM Plex Serif","Noto Serif TC",Georgia,serif;
  --font-body:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,sans-serif;
  --font-mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,SFMono-Regular,monospace;
  --maxw:44rem;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#10171A; --surface:#192125; --surface-2:#212C31; --surface-3:#2A363C;
  --ink:#E7EEEF; --ink-2:#A6B8BF; --ink-3:#7A8E96;
  --rule:#2A363B; --rule-2:#3B4A51;
  --accent:#6FB5E4; --accent-2:#9CCFF0; --accent-soft:#17303F; --on-accent:#0B1418;
  --signal:#E8874A; --signal-soft:#33241A;
  --s1:#3D93E0; --s2:#DC6E28; --s3:#A472E8;
  --good:#63BC96; --good-soft:#142C23;
  --warn:#D9A648; --warn-soft:#2D2415;
  --bad:#E07B6C; --bad-soft:#321D1A;
  --grid:rgba(111,181,228,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --paper:#10171A; --surface:#192125; --surface-2:#212C31; --surface-3:#2A363C;
  --ink:#E7EEEF; --ink-2:#A6B8BF; --ink-3:#7A8E96;
  --rule:#2A363B; --rule-2:#3B4A51;
  --accent:#6FB5E4; --accent-2:#9CCFF0; --accent-soft:#17303F; --on-accent:#0B1418;
  --signal:#E8874A; --signal-soft:#33241A;
  --s1:#3D93E0; --s2:#DC6E28; --s3:#A472E8;
  --good:#63BC96; --good-soft:#142C23;
  --warn:#D9A648; --warn-soft:#2D2415;
  --bad:#E07B6C; --bad-soft:#321D1A;
  --grid:rgba(111,181,228,.08);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);
  font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code,.mono{font-family:var(--font-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}

/* ---------- 版面 ---------- */
.shell{display:grid;grid-template-columns:16.5rem minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100dvh;
  background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column}
.rail-head{padding:1.15rem 1.15rem .85rem;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:.5rem}
.brand-mark{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;color:var(--signal);
  text-transform:uppercase}
.brand h1{font-size:1.06rem;letter-spacing:-.01em}
.brand-sub{font-size:.76rem;color:var(--ink-3);margin-top:.15rem}
.prog{margin-top:.8rem;display:flex;align-items:center;gap:.6rem}
.prog-bar{flex:1;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.prog-fill{height:100%;background:var(--accent);width:0;transition:width .4s ease}
.prog-txt{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-2)}
.rail-nav{overflow-y:auto;padding:.6rem .55rem 2rem;flex:1;scrollbar-width:thin}
.part-label{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.13em;color:var(--ink-3);
  text-transform:uppercase;padding:.95rem .6rem .3rem}
.nav-item{display:grid;grid-template-columns:1.45rem 1fr;gap:.45rem;align-items:start;width:100%;
  text-align:left;padding:.4rem .6rem;border-radius:7px;font-size:.845rem;color:var(--ink-2);line-height:1.45}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav-item.locked{opacity:.45;cursor:not-allowed}
.nav-n{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-3);padding-top:.12rem}
.nav-item[aria-current="true"] .nav-n{color:var(--accent)}
.nav-item.done .nav-n::after{content:"✓";color:var(--good)}
.nav-item.done .nav-n{font-size:0}
.rail-foot{border-top:1px solid var(--rule);padding:.6rem .8rem;display:flex;gap:.5rem;flex-wrap:wrap}
.mini-btn{font-size:.74rem;color:var(--ink-3);padding:.2rem .4rem;border-radius:5px}
.mini-btn:hover{color:var(--ink);background:var(--surface-2)}

.main{min-width:0;display:flex;flex-direction:column;align-items:center;padding:0 1.6rem 5rem}
.scrim{display:none}
.wrap{width:100%;max-width:var(--maxw)}
.topbar{display:none}

/* ---------- 關卡標頭 ---------- */
.stage-head{padding-block:2.6rem 1.6rem;border-bottom:1px solid var(--rule);margin-bottom:1.8rem}
.eyebrow{font-family:var(--font-mono);font-size:.71rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--signal);display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.eyebrow .dot{width:3px;height:3px;border-radius:99px;background:var(--rule-2)}
.eyebrow .part{color:var(--ink-3)}
.stage-head h2{font-size:2rem;letter-spacing:-.02em;margin:.5rem 0 .45rem}
.lede{color:var(--ink-2);font-size:1.02rem}
.goals{margin-top:1.15rem;display:flex;flex-wrap:wrap;gap:.4rem}
.goal{font-size:.78rem;padding:.2rem .55rem;border:1px solid var(--rule-2);border-radius:99px;color:var(--ink-2)}

/* ---------- 內文區塊 ---------- */
.body{display:flex;flex-direction:column;gap:1.15rem}
.body h3{font-size:1.22rem;margin-top:1.1rem;letter-spacing:-.01em}
.body h4{font-size:.98rem;font-family:var(--font-body);font-weight:600;color:var(--ink)}
.body p{color:var(--ink-2)}
.body strong{color:var(--ink);font-weight:600}
.body em{font-style:italic;font-family:var(--font-mono);font-style:normal;color:var(--ink)}
.ul{margin:0;padding-left:1.15rem;color:var(--ink-2);display:flex;flex-direction:column;gap:.4rem}
.ul li::marker{color:var(--rule-2)}
.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:.55rem}
.steps li{counter-increment:st;display:grid;grid-template-columns:1.5rem 1fr;gap:.6rem;color:var(--ink-2)}
.steps li::before{content:counter(st);font-family:var(--font-mono);font-size:.74rem;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;width:1.5rem;height:1.5rem;display:grid;place-items:center}

.note{border-left:2px solid var(--accent);background:var(--accent-soft);padding:.85rem 1rem;border-radius:0 8px 8px 0}
.note .nt{font-size:.72rem;font-family:var(--font-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);display:block;margin-bottom:.25rem}
.note p{color:var(--ink-2)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)} .note.warn .nt{color:var(--warn)}
.note.trap{border-color:var(--bad);background:var(--bad-soft)} .note.trap .nt{color:var(--bad)}
.note.key{border-color:var(--signal);background:var(--signal-soft)} .note.key .nt{color:var(--signal)}

.formula{font-family:var(--font-mono);background:var(--surface);border:1px solid var(--rule);
  border-radius:8px;padding:.9rem 1rem;text-align:center;font-size:1rem;color:var(--ink);
  overflow-x:auto;white-space:nowrap}
.formula .cap{display:block;font-family:var(--font-body);font-size:.76rem;color:var(--ink-3);
  margin-top:.45rem;white-space:normal}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .25em}
.frac .n{border-bottom:1px solid currentColor;padding:0 .35em .1em}
.frac .d{padding:.1em .35em 0}
sub,sup{font-size:.72em}

.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:9px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:.5rem .7rem;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
thead th{background:var(--surface-2);font-weight:600;font-size:.76rem;color:var(--ink-2);
  letter-spacing:.02em;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:.8rem}
.tbl-cap{font-size:.76rem;color:var(--ink-3);margin-top:.4rem}

/* ---------- 三軟體分頁 ---------- */
.soft{border:1px solid var(--rule);border-radius:11px;background:var(--surface);overflow:hidden}
.soft-tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);background:var(--surface-2)}
.soft-tab{flex:1;padding:.55rem .5rem;font-size:.82rem;font-weight:500;color:var(--ink-3);
  border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:.35rem}
.soft-tab:hover{color:var(--ink)}
.soft-tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface)}
.soft-tab .sw{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.75}
.soft-body{padding:1rem 1.05rem;display:flex;flex-direction:column;gap:.8rem}
.soft-body h5{margin:0;font-size:.8rem;font-family:var(--font-mono);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500}
.path{font-family:var(--font-mono);font-size:.82rem;background:var(--surface-2);border-radius:6px;
  padding:.45rem .6rem;color:var(--ink);overflow-x:auto;white-space:nowrap}
.path b{color:var(--accent);font-weight:500}
pre.code{margin:0;font-family:var(--font-mono);font-size:.78rem;line-height:1.65;background:var(--surface-2);
  border-radius:7px;padding:.7rem .8rem;overflow-x:auto;color:var(--ink)}
pre.code .cm{color:var(--ink-3)}
pre.code .kw{color:var(--accent)}

/* ---------- 輸出報表 ---------- */
.out{border:1px solid var(--rule-2);border-radius:9px;background:var(--surface);overflow:hidden}
.out-head{padding:.5rem .8rem;background:var(--surface-2);border-bottom:1px solid var(--rule);
  font-size:.75rem;font-family:var(--font-mono);letter-spacing:.06em;color:var(--ink-2);
  display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.out .tbl-wrap{border:0;border-radius:0}
.out mark{background:var(--signal-soft);color:var(--signal);font-weight:600;padding:.05rem .25rem;border-radius:3px}
.read{padding:.75rem .85rem;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:.45rem;
  background:var(--surface-2)}
.read-row{display:grid;grid-template-columns:auto 1fr;gap:.55rem;font-size:.82rem;color:var(--ink-2);align-items:start}
.read-key{font-family:var(--font-mono);font-size:.72rem;color:var(--accent);background:var(--accent-soft);
  padding:.05rem .4rem;border-radius:4px;white-space:nowrap}

/* ---------- 互動元件 ---------- */
.sim{border:1px solid var(--rule);border-radius:12px;background:var(--surface);overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
.sim-head{padding:.7rem .9rem;border-bottom:1px solid var(--rule);background:var(--surface);
  display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.sim-head h4{font-size:.92rem;font-family:var(--font-body)}
.sim-head .hint{font-size:.74rem;color:var(--ink-3)}
.sim-body{padding:.9rem}
.canvas-box{position:relative;width:100%}
canvas{display:block;width:100%;max-width:100%;border-radius:7px;touch-action:none}
.ctrls{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:.8rem;align-items:flex-end}
.ctrl{display:flex;flex-direction:column;gap:.2rem;flex:1;min-width:8.5rem}
.ctrl label{font-size:.74rem;color:var(--ink-3);display:flex;justify-content:space-between;gap:.5rem}
.ctrl label b{font-family:var(--font-mono);color:var(--ink);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
select,input[type=number]{font:inherit;font-size:.84rem;padding:.3rem .45rem;border-radius:6px;
  border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);max-width:100%}
.btn{background:var(--accent);color:var(--on-accent);padding:.42rem .85rem;border-radius:7px;font-size:.84rem;font-weight:500}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--rule-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.readout{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:.4rem .65rem;flex:1;min-width:5.2rem}
.stat .k{font-size:.68rem;color:var(--ink-3);font-family:var(--font-mono);letter-spacing:.05em}
.stat .v{font-family:var(--font-mono);font-size:1.02rem;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.hi .v{color:var(--signal)}
.legend{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:.6rem;font-size:.76rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:11px;height:3px;border-radius:2px;display:inline-block}

/* ---------- 迷你試算表 ---------- */
.lab{border:1px solid var(--rule);border-radius:12px;background:var(--surface);overflow:hidden}
.lab-head{padding:.7rem .9rem;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;
  align-items:baseline;gap:.6rem;flex-wrap:wrap;background:var(--surface-2)}
.lab-head h4{font-size:.92rem;font-family:var(--font-body)}
.lab-head .hint{font-size:.74rem;color:var(--ink-3)}
.fbar{display:grid;grid-template-columns:4.2rem 1fr;gap:.5rem;align-items:center;padding:.4rem .6rem;
  border-bottom:1px solid var(--rule);background:var(--surface)}
.fbar .fref{font-family:var(--font-mono);font-size:.76rem;color:var(--ink-3);text-align:center;
  background:var(--surface-2);border-radius:5px;padding:.15rem 0}
.fbar .fval{font-family:var(--font-mono);font-size:.78rem;color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.sheet-wrap{overflow:auto;max-height:21rem;background:var(--surface)}
table.sheet{border-collapse:separate;border-spacing:0;font-family:var(--font-mono);font-size:.76rem;
  font-variant-numeric:tabular-nums}
.sheet th,.sheet td{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  white-space:nowrap;height:1.55rem}
.sheet thead th{position:sticky;top:0;z-index:3;background:var(--surface-3);color:var(--ink-3);
  text-align:center;font-weight:500;min-width:3.6rem;padding:.1rem .35rem;font-size:.7rem}
.sheet thead th:first-child{left:0;z-index:4;min-width:2.1rem}
.sheet tbody th{position:sticky;left:0;z-index:2;background:var(--surface-3);color:var(--ink-3);
  text-align:center;font-weight:400;min-width:2.1rem;padding:.1rem .3rem;font-size:.7rem}
.sheet td{padding:.1rem .4rem;color:var(--ink);text-align:right}
.sheet td.hdr{background:var(--surface-2);font-weight:600;color:var(--ink);text-align:center;font-size:.72rem}
.sheet td.lbl{text-align:left;color:var(--ink-2);background:var(--surface-2);font-family:var(--font-body);
  font-size:.74rem;padding-left:.5rem}
.sheet td.edit{padding:0;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.sheet td.edit input{width:100%;min-width:8.5rem;border:0;background:transparent;font:inherit;
  color:var(--ink);padding:.1rem .4rem;text-align:right;border-radius:0}
.sheet td.edit input:focus{outline:2px solid var(--accent);outline-offset:-2px;text-align:left}
.sheet td.ok{background:var(--good-soft);box-shadow:inset 0 0 0 1px var(--good)}
.sheet td.bad{background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.sheet td.err{color:var(--bad)}
.tasks{display:flex;flex-direction:column;gap:.5rem;padding:.85rem;border-top:1px solid var(--rule)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:.55rem;align-items:center;
  border:1px solid var(--rule);border-radius:9px;padding:.5rem .65rem}
.task .tc{font-family:var(--font-mono);font-size:.72rem;color:var(--accent);background:var(--accent-soft);
  padding:.1rem .4rem;border-radius:4px;align-self:start;margin-top:.1rem}
.task .td{font-size:.84rem;color:var(--ink-2)}
.task .td b{color:var(--ink)}
.task .ta{display:flex;gap:.35rem;align-self:start}
.task .mini{font-size:.74rem;padding:.2rem .45rem;border-radius:5px;border:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap}
.task .mini:hover{background:var(--surface-2);color:var(--ink)}
.task .msg{grid-column:1/-1;font-size:.78rem;border-radius:6px;padding:.35rem .5rem;
  background:var(--surface-2);color:var(--ink-2);font-family:var(--font-body)}
.task.solved{border-color:var(--good);background:var(--good-soft)}
.task.solved .msg{background:transparent;color:var(--good)}
.task.miss{border-color:var(--bad)}
.task.miss .msg{background:var(--bad-soft);color:var(--bad)}
.lab-foot{padding:.65rem .85rem;border-top:1px solid var(--rule);display:flex;gap:.5rem;
  align-items:center;flex-wrap:wrap;justify-content:space-between}
.fn-list{padding:.7rem .85rem;border-top:1px solid var(--rule);font-size:.78rem;color:var(--ink-2)}
.fn-list summary{cursor:pointer;font-size:.78rem;color:var(--ink-3)}
.fn-list code{display:inline-block;background:var(--surface-2);border-radius:4px;padding:.05rem .3rem;margin:.12rem .12rem 0 0}

/* ---------- 深入區塊 ---------- */
.sec{display:flex;align-items:center;gap:.7rem;margin-top:1.6rem}
.sec .st{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--signal);white-space:nowrap}
.sec .sl{flex:1;height:1px;background:var(--rule)}
.derive{border:1px solid var(--rule);border-radius:11px;background:var(--surface);overflow:hidden}
.derive-h{padding:.55rem .85rem;background:var(--surface-2);border-bottom:1px solid var(--rule);
  font-size:.8rem;font-weight:600;color:var(--ink)}
.dstep{display:grid;grid-template-columns:1.6rem 1fr;gap:.6rem;padding:.7rem .85rem;
  border-bottom:1px solid var(--rule);align-items:start}
.dstep:last-child{border-bottom:0}

    for(let i=0;i<n;i++){let p=1;for(const ar of arrs)p*=(ar[i]||0);s+=p;} return s;});

    return c?scalar(a[1]):(a.length>2?scalar(a[2]):false);});
  def('IFERROR',a=>{need(a,2);try{const v=scalar(a[0]);return isErr(v)?scalar(a[1]):v;}catch(e){return scalar(a[1]);}});
  def('AND',a=>flat(a).every(v=>truth(v)));
  def('OR',a=>flat(a).some(v=>truth(v)));
  def('NOT',a=>!truth(scalar(a[0])));
  def('CHOOSE',a=>{const i=num(scalar(a[0]));if(i<1||i>=a.length)throw {fx:'#VALUE!'};return scalar(a[i]);});
  def('COUNTIF',a=>{need(a,2);const m=matcher(a[1]);return flat(a[0]).filter(m).length;});
  def('SUMIF',a=>{need(a,2);const m=matcher(a[1]),r=flat(a[0]),s=a.length>2?flat(a[2]):r;
    let t=0;r.forEach((v,i)=>{if(m(v)&&typeof s[i]==='number')t+=s[i];});return t;});
  def('AVERAGEIF',a=>{need(a,2);const m=matcher(a[1]),r=flat(a[0]),s=a.length>2?flat(a[2]):r;
    const o=[];r.forEach((v,i)=>{if(m(v)&&typeof s[i]==='number')o.push(s[i]);});
    if(!o.length)throw {fx:'#DIV/0!'};return S_().mean(o);});
  def('COUNTIFS',a=>{const n=flat(a[0]).length;let c=0;
    for(let i=0;i<n;i++){let ok=true;
      for(let k=0;k<a.length;k+=2){const m=matcher(a[k+1]);if(!m(flat(a[k])[i])){ok=false;break;}}
      if(ok)c++;} return c;});
  def('AVERAGEIFS',a=>{const s=flat(a[0]),n=s.length,o=[];
    for(let i=0;i<n;i++){let ok=true;
      for(let k=1;k<a.length;k+=2){const m=matcher(a[k+1]);if(!m(flat(a[k])[i])){ok=false;break;}}
      if(ok&&typeof s[i]==='number')o.push(s[i]);}
    if(!o.length)throw {fx:'#DIV/0!'};return S_().mean(o);});
  const pair=a=>{need(a,2);const x=flat(a[0]),y=flat(a[1]),X=[],Y=[];
    for(let i=0;i<Math.min(x.length,y.length);i++){
      if(typeof x[i]==='number'&&typeof y[i]==='number'){X.push(x[i]);Y.push(y[i]);}}
    if(X.length<2)throw {fx:'#DIV/0!'};return [X,Y];};
  def('CORREL PEARSON',a=>{const [x,y]=pair(a);return S_().pearson(x,y).r;});
  def('RSQ',a=>{const [x,y]=pair(a);const r=S_().pearson(x,y).r;return r*r;});
  def('SLOPE',a=>{const [y,x]=pair(a);return S_().regress(y,[x]).beta[1];});
  def('INTERCEPT',a=>{const [y,x]=pair(a);return S_().regress(y,[x]).beta[0];});
  def('STEYX',a=>{const [y,x]=pair(a);return S_().regress(y,[x]).seEst;});
  def('FORECAST.LINEAR FORECAST',a=>{need(a,3);const [y,x]=pair([a[1],a[2]]);
    const r=S_().regress(y,[x]);return r.beta[0]+r.beta[1]*num(scalar(a[0]));});
  def('STANDARDIZE',a=>{need(a,3);const s=num(scalar(a[2]));if(s<=0)throw {fx:'#NUM!'};
    return (num(scalar(a[0]))-num(scalar(a[1])))/s;});
  def('CONFIDENCE.T',a=>{need(a,3);const al=num(scalar(a[0])),sd=num(scalar(a[1])),n=num(scalar(a[2]));
    return S_().qt(1-al/2,n-1)*sd/Math.sqrt(n);});
  def('CONFIDENCE.NORM CONFIDENCE',a=>{need(a,3);const al=num(scalar(a[0])),sd=num(scalar(a[1])),n=num(scalar(a[2]));
    return S_().qnorm(1-al/2)*sd/Math.sqrt(n);});
  def('NORM.DIST NORMDIST',a=>{need(a,4);const x=num(scalar(a[0])),m=num(scalar(a[1])),s=num(scalar(a[2]));
    return truth(scalar(a[3]))?S_().pnorm(x,m,s):S_().dnorm(x,m,s);});
  def('NORM.S.DIST',a=>{const z=num(scalar(a[0]));
    return (a.length>1&&!truth(scalar(a[1])))?S_().dnorm(z):S_().pnorm(z);});
  def('NORMSDIST',a=>S_().pnorm(num(scalar(a[0]))));
  def('NORM.INV NORMINV',a=>{need(a,3);return num(scalar(a[1]))+S_().qnorm(num(scalar(a[0])))*num(scalar(a[2]));});
  def('NORM.S.INV NORMSINV',a=>S_().qnorm(num(scalar(a[0]))));
  def('T.DIST',a=>{need(a,3);const t=num(scalar(a[0])),d=num(scalar(a[1]));
    return truth(scalar(a[2]))?S_().pt(t,d):S_().dt(t,d);});
  def('T.DIST.2T',a=>{need(a,2);const t=num(scalar(a[0]));if(t<0)throw {fx:'#NUM!'};
    return 2*(1-S_().pt(t,num(scalar(a[1]))));});
  def('T.DIST.RT',a=>{need(a,2);return 1-S_().pt(num(scalar(a[0])),num(scalar(a[1])));});
  def('T.INV',a=>{need(a,2);return S_().qt(num(scalar(a[0])),num(scalar(a[1])));});
  def('T.INV.2T',a=>{need(a,2);return S_().qt(1-num(scalar(a[0]))/2,num(scalar(a[1])));});
  def('F.DIST.RT',a=>{need(a,3);return 1-S_().pf(num(scalar(a[0])),num(scalar(a[1])),num(scalar(a[2])));});
  def('F.INV.RT',a=>{need(a,3);const p=num(scalar(a[0])),d1=num(scalar(a[1])),d2=num(scalar(a[2]));
    let lo=0,hi=1000;for(let i=0;i<200;i++){const m=(lo+hi)/2;if(1-S_().pf(m,d1,d2)>p)lo=m;else hi=m;}return (lo+hi)/2;});
  def('CHISQ.DIST.RT',a=>{need(a,2);return 1-S_().pchisq(num(scalar(a[0])),num(scalar(a[1])));});
  def('CHISQ.INV.RT',a=>{need(a,2);const p=num(scalar(a[0])),k=num(scalar(a[1]));
    let lo=0,hi=1000;for(let i=0;i<200;i++){const m=(lo+hi)/2;if(1-S_().pchisq(m,k)>p)lo=m;else hi=m;}return (lo+hi)/2;});
  def('CHISQ.TEST CHITEST',a=>{need(a,2);const o=nums(a[0]),e=nums(a[1]);
    let x2=0;o.forEach((v,i)=>{if(!e[i])throw {fx:'#DIV/0!'};x2+=(v-e[i])*(v-e[i])/e[i];});
    const r0=a[0].__range?(a[0].r2-a[0].r1+1):o.length, c0=a[0].__range?(a[0].c2-a[0].c1+1):1;
    const df=(r0>1&&c0>1)?(r0-1)*(c0-1):Math.max(1,o.length-1);
    return 1-S_().pchisq(x2,df);});
  def('T.TEST TTEST',a=>{need(a,4);const x=nums(a[0]),y=nums(a[1]);
    const tails=num(scalar(a[2])), type=num(scalar(a[3]));
    let r;
    if(type===1){ if(x.length!==y.length)throw {fx:'#N/A'}; r=S_().tTestPaired(x,y);}
    else r=S_().tTestInd(x,y,type===3);
    return tails===1?r.p/2:r.p;});
  def('F.TEST FTEST',a=>{need(a,2);const x=nums(a[0]),y=nums(a[1]);
    const v1=S_().variance(x),v2=S_().variance(y);
    const f=v1/v2, d1=x.length-1, d2=y.length-1;
    const p=f>1?1-S_().pf(f,d1,d2):S_().pf(f,d1,d2);
    return 2*p;});
  def('Z.TEST ZTEST',a=>{need(a,2);const x=nums(a[0]),m=num(scalar(a[1]));
    const s=a.length>2?num(scalar(a[2])):S_().sd(x);
    return 1-S_().pnorm((S_().mean(x)-m)/(s/Math.sqrt(x.length)));});
  def('FISHER',a=>{const r=num(scalar(a[0]));return .5*Math.log((1+r)/(1-r));});
  def('FISHERINV',a=>Math.tanh(num(scalar(a[0]))));

  function truth(v){ if(isErr(v))throw {fx:v};
    if(typeof v==='boolean')return v; if(typeof v==='number')return v!==0;
    if(v===''||v===null||v===undefined)return false;
    const s=String(v).toUpperCase(); if(s==='TRUE')return true; if(s==='FALSE')return false;
    return !!v;}
  function scalar(v){ if(v&&v.__range)return v.vals.length?v.vals[0]:''; return v;}

  /* ---- 求值 ---- */
  function evalNode(node,ctx){
    switch(node.n){
      case 'num': return node.v;
      case 'str': return node.v;
      case 'bool': return node.v;
      case 'neg': {const v=num(scalar(evalNode(node.v,ctx)));return node.op==='-'?-v:v;}
      case 'pct': return num(scalar(evalNode(node.v,ctx)))/100;
      case 'cat': return String(disp(scalar(evalNode(node.l,ctx))))+String(disp(scalar(evalNode(node.r,ctx))));
      case 'bin': {
        const a=num(scalar(evalNode(node.l,ctx))), b=num(scalar(evalNode(node.r,ctx)));
        switch(node.op){case '+':return a+b;case '-':return a-b;case '*':return a*b;
          case '/':if(b===0)throw {fx:'#DIV/0!'};return a/b;
          case '^':{const r=Math.pow(a,b);if(!isFinite(r))throw {fx:'#NUM!'};return r;}}
        throw {fx:'#VALUE!'};}
      case 'cmp': {
        let a=scalar(evalNode(node.l,ctx)), b=scalar(evalNode(node.r,ctx));
        if(isErr(a))throw {fx:a}; if(isErr(b))throw {fx:b};
        if(typeof a==='number'&&typeof b==='number'){}
        else if(typeof a==='boolean'||typeof b==='boolean'){a=truth(a);b=truth(b);}
        else if(typeof a!=='number'||typeof b!=='number'){a=String(a).toUpperCase();b=String(b).toUpperCase();}
        switch(node.op){case '=':return a===b;case '<>':return a!==b;case '<':return a<b;
          case '<=':return a<=b;case '>':return a>b;case '>=':return a>=b;}
        throw {fx:'#VALUE!'};}
      case 'ref': return ctx.get(node.c,node.r);
      case 'rng': {
        const vals=[];
        for(let r=node.r1;r<=node.r2;r++)for(let c=node.c1;c<=node.c2;c++)vals.push(ctx.get(c,r));
        return {__range:true,vals,r1:node.r1,r2:node.r2,c1:node.c1,c2:node.c2};}
      case 'fn': {
        const f=F[node.name]; if(!f)throw {fx:'#NAME?'};
        if(node.name==='IF'||node.name==='IFERROR'){
          const lazy=node.args.map(a=>()=>evalNode(a,ctx));
          if(node.name==='IF'){const c=truth(scalar(lazy[0]()));
            return c?scalar(lazy[1]()):(lazy.length>2?scalar(lazy[2]()):false);}
          try{const v=scalar(lazy[0]());return isErr(v)?scalar(lazy[1]()):v;}catch(e){return scalar(lazy[1]());}}
        return f(node.args.map(a=>evalNode(a,ctx)));}
    }
    throw {fx:'#VALUE!'};
  }
  const disp=v=>{ if(v===null||v===undefined)return '';
    if(typeof v==='boolean')return v?'TRUE':'FALSE'; return v;};

  /* ---- 工作表 ---- */
  function makeBook(){
    const raw={};            // "c,r" -> 原始輸入（字串）
    const cache={};          // "c,r" -> 值
    const stack=[];
    const key=(c,r)=>c+','+r;
    const ctx={get(c,r){
      const k=key(c,r);
      if(cache.hasOwnProperty(k))return cache[k];
      if(stack.indexOf(k)>=0)throw {fx:'#CIRC!'};
      const src=raw[k];
      if(src===undefined||src===null||src==='')return '';
      if(typeof src==='number')return src;
      const s=String(src);
      if(s[0]!=='='){ const f=parseFloat(s);
        const v=(s.trim()!==''&&!isNaN(f)&&/^-?[\d.]+(e-?\d+)?$/i.test(s.trim()))?f:s;
        cache[k]=v; return v;}
      stack.push(k);
      let v;
      try{ v=scalar(evalNode(parse(lex(s.slice(1))),ctx)); }
      catch(e){ v=e&&e.fx?e.fx:'#VALUE!'; }
      stack.pop();
      cache[k]=v; return v;
    }};
    return {
      set(c,r,v){raw[key(c,r)]=v;for(const k in cache)delete cache[k];},
      setRef(ref,v){const m=/^([A-Za-z]+)([0-9]+)$/.exec(ref);this.set(colIndex(m[1]),parseInt(m[2],10)-1,v);},
      getRaw(c,r){const v=raw[key(c,r)];return v===undefined?'':v;},
      getRawRef(ref){const m=/^([A-Za-z]+)([0-9]+)$/.exec(ref);return this.getRaw(colIndex(m[1]),parseInt(m[2],10)-1);},
      value(c,r){try{return ctx.get(c,r);}catch(e){return e&&e.fx?e.fx:'#VALUE!';}},
      valueRef(ref){const m=/^([A-Za-z]+)([0-9]+)$/.exec(ref);
        if(!m)return '#REF!';return this.value(colIndex(m[1]),parseInt(m[2],10)-1);},
      clearCache(){for(const k in cache)delete cache[k];}
    };
  }
  return {makeBook,colName,colIndex,isErr,disp,FUNCS:Object.keys(F)};
})();
if(typeof module!=='undefined')module.exports=FX;

   ['p','JASP 只認得它自己判定的尺度。匯入時若某欄混進一個文字，整欄會被判成 Nominal，之後就無法拉進需要 Scale 的欄位——這是最常見的「拉不進去」原因。']],
  spss:[['ol',['在<b>資料檢視</b>貼上或匯入資料。',
   '切到<b>變數檢視</b>，逐列設定：<b>名稱</b>、<b>類型</b>（數值）、<b>小數</b>、<b>標籤</b>（中文變項名）、<b>數值</b>（編碼標籤）、<b>遺漏</b>、<b>測量</b>（名義／次序／尺度）。',
   '<b>測量</b>欄就是 SPSS 版的測量尺度，會影響某些程序的預設圖表。']],
   ['h','用語法一次設定完'],
   ['code','VARIABLE LABELS group \'實驗組別\' mem \'記憶測驗分數\'.\nVALUE LABELS group 0 \'控制組\' 1 \'睡眠限制組\' 2 \'睡眠衛教組\'\n  /sex 0 \'女\' 1 \'男\'.\nVARIABLE LEVEL group sex (NOMINAL) sleep phone mem (SCALE).\nMISSING VALUES mem (999).\nEXECUTE.'],
   ['p','SPSS 的 <b>遺漏值</b>要明確宣告，否則 999 會被當成真實分數。這是 SPSS 和 Excel 都會咬人的地方。']]}),
 ],
 quiz:[
  {q:'研究者記錄每位受試者「四週內失眠發作的夜數」（0–28 夜）。這是什麼測量尺度？',
   opts:['名義','次序','等距','比率'],a:3,
   why:'有絕對零點（0 夜＝完全沒發作），而且 14 夜確實是 7 夜的兩倍，所以是<b>比率</b>尺度。次數型資料幾乎都是比率尺度。'},
  {q:'下列哪一種情況應該用「受試者內」設計來分析？',
   opts:['比較三個不同班級的焦慮分數','比較同一批人在介入前與介入後的焦慮分數','比較男女生的睡眠時數','比較有無打工的學生成績'],a:1,
   why:'同一批人被測量了兩次，兩筆分數是配對的，屬於<b>受試者內</b>。其他三個選項都是不同人之間的比較（受試者間）。'},
  {q:'你在 JASP 裡想把 <code>mem</code> 拉進 Dependent Variable，但拉不進去。最可能的原因是？',
   opts:['樣本數太小','JASP 把 mem 判成 Nominal，因為該欄混入了文字或空字串','JASP 需要先做常態性檢定','mem 的數值範圍太大'],a:1,
   why:'JASP 依照欄位內容自動判定測量尺度。只要有一格是文字（包括匯入時多出來的空白字元），整欄就變成 Nominal，無法放進要求 Scale 的位置。改掉那格或手動把圖示切成 Scale 即可。'}]},

/* ============ 2 ============ */
{id:2,part:0,title:'描述統計：中心與散布',lede:'一組分數要用兩個數字來抓住：它大概落在哪裡（集中量數），以及它有多散（離散量數）。',
 mins:16,goals:['平均數與中位數','標準差','偏態的影響'],body:[
 H('集中量數：三種「中間」'),
 UL(['<b>平均數</b> <i>M</i>：所有分數加總除以個數。用了每一筆資料，但一個極端值就能把它拉走。',
   '<b>中位數</b> <i>Mdn</i>：排序後正中間那個。完全不理會極端值有多極端。',
   '<b>眾數</b>：出現最多次的分數。名義變項唯一能用的集中量數。']),
 FML('<i>M</i> = <span class="frac"><span class="n">Σ<i>X</i></span><span class="d"><i>n</i></span></span>','把所有分數加起來，除以人數'),
 P('動手試試看：拖動下面任何一個點，或把最右邊那點拖到很遠的地方，觀察平均數（藍線）跟中位數（紫線）誰跑得比較快。'),
 SIM('desc'),
 NOTE('key','什麼時候該報中位數','分配明顯偏斜時（收入、反應時間、症狀嚴重度常常如此），中位數更能代表「典型的人」。心理學論文的慣例是：常態就報 <i>M</i> (<i>SD</i>)，偏斜就<b>兩個都報</b>，並說明為什麼。'),
 H('離散量數：這組人有多不一樣'),
 P('兩班平均都是 40 分，一班全部 38–42，另一班從 10 分到 60 分。平均數一樣，但完全是兩回事。離散量數就是在描述這個差別。'),
 FML('<i>s</i><sup>2</sup> = <span class="frac"><span class="n">Σ(<i>X</i> − <i>M</i>)<sup>2</sup></span><span class="d"><i>n</i> − 1</span></span>　　<i>s</i> = √<i>s</i><sup>2</sup>','變異數與標準差'),
 UL(['<b>全距</b>：最大減最小。只用到兩筆資料，非常不穩。',
   '<b>四分位距 IQR</b>：<i>Q</i><sub>3</sub> − <i>Q</i><sub>1</sub>，中間 50% 的人分布在多寬的範圍。和中位數是一對。',
   '<b>變異數</b> <i>s</i><sup>2</sup>：平均的「離差平方」。單位是原單位的平方（分數<sup>2</sup>），沒辦法直觀解讀。',
   '<b>標準差</b> <i>s</i>：變異數開根號，回到原單位。和平均數是一對，是整個推論統計的主角。']),
 NOTE('warn','為什麼是除以 n − 1','用樣本平均數當中心去算離差，會系統性地低估母體的變異。除以 <i>n</i> − 1（自由度）正好把這個偏誤修掉。<b>Excel 的 <code>STDEV.S</code>／<code>VAR.S</code> 除以 n − 1，<code>STDEV.P</code>／<code>VAR.P</code> 除以 n。</b>做研究幾乎永遠用 .S 版本；用錯在小樣本會差很多。'),
 H('自由度：這門課會一直看到的東西'),
 P('自由度 <i>df</i> 是「可以自由變動的數值個數」。已知 5 個分數的平均是 10，前 4 個你愛填什麼都行，第 5 個就被鎖死了——所以 <i>df</i> = 4 = <i>n</i> − 1。之後每個檢定的 <i>df</i> 都是同一個道理：<b>總資料數，扣掉你為了計算而先估出來的參數個數</b>。'),
 H('偏態與峰度'),
 P('<b>偏態 skewness</b> 描述分配歪向哪一邊：正偏（右尾長）代表少數人分數特別高，例如反應時間；負偏（左尾長）代表少數人特別低，例如簡單測驗的分數。<b>峰度 kurtosis</b> 描述尾巴有多重。'),
 P('常用的粗略判準：偏態與峰度的絕對值小於 2（保守一點用 1）時，把資料當成近似常態處理是可以接受的。這只是經驗法則，不是檢定。'),
 H('先看你這份資料的描述統計'),
 OUT('desc'),
 SOFT({excel:[['h','逐項函數'],
   ['code','=AVERAGE(D2:D61)     &lt;- 平均數 M\n=MEDIAN(D2:D61)      &lt;- 中位數\n=MODE.SNGL(D2:D61)   &lt;- 眾數\n=STDEV.S(D2:D61)     &lt;- 標準差（樣本，除以 n-1）\n=VAR.S(D2:D61)       &lt;- 變異數（樣本）\n=QUARTILE.INC(D2:D61,1)  &lt;- Q1\n=QUARTILE.INC(D2:D61,3)  &lt;- Q3\n=SKEW(D2:D61)  =KURT(D2:D61)\n=COUNT(D2:D61)  =MIN(...)  =MAX(...)'],
   ['h','一次做完：分析工具箱'],
   ['path','資料 › <b>資料分析</b> › 敘述統計 › 勾選「摘要統計」與「平均數信賴度 95%」'],
   ['p','若「資料分析」沒出現：檔案 › 選項 › 增益集 › 管理「Excel 增益集」› 執行 › 勾選 <b>分析工具箱</b>。Mac 版在「工具 › Excel 增益集」。'],
   ['h','分組算描述統計'],
   ['code','=AVERAGEIF($B$2:$B$61, 0, $D$2:$D$61)\n=COUNTIF($B$2:$B$61, 0)\n=STDEV.S(IF($B$2:$B$61=0, $D$2:$D$61))   &lt;- 陣列公式，舊版要按 Ctrl+Shift+Enter']],
  jasp:[['ol',['左上 <b>Descriptives</b> › <b>Descriptives</b>。',
   '把 <code>mem</code>、<code>sleep</code>、<code>phone</code> 拉進 <b>Variables</b>。',
   '要分組看：把 <code>group</code> 拉進 <b>Split</b>。',
   '展開 <b>Statistics</b> 面板，勾 Mean／Median／Std. deviation／Variance／Skewness／Kurtosis／Minimum／Maximum／Quartiles。',
   '展開 <b>Plots</b>，勾 <b>Distribution plots</b> 與 <b>Boxplots</b>（再勾 Label outliers）。']],
   ['p','JASP 的表格可以直接右鍵 › <b>Copy</b>，貼進 Word 就是排版好的 APA 表格；右鍵 › <b>Add Note</b> 可以在報表裡寫註解。這是 JASP 最省時間的地方。']],
  spss:[['h','選單'],
   ['path','分析 › 敘述統計 › <b>描述性統計量</b>（要偏態峰度就按「選項」勾起來）'],
   ['path','分析 › 敘述統計 › <b>次數分配表</b> › 統計量（一次要到中位數、眾數、四分位數）'],
   ['path','分析 › 敘述統計 › <b>預檢資料</b>（Explore）— 分組描述＋盒鬚圖＋常態性檢定一次到位'],
   ['h','語法'],
   ['code','FREQUENCIES VARIABLES=mem sleep phone\n  /STATISTICS=MEAN MEDIAN MODE STDDEV VARIANCE\n     SKEWNESS KURTOSIS MINIMUM MAXIMUM\n  /PERCENTILES=25 50 75\n  /HISTOGRAM NORMAL.\n\nEXAMINE VARIABLES=mem BY group\n  /PLOT BOXPLOT HISTOGRAM NPPLOT\n  /STATISTICS DESCRIPTIVES\n  /MISSING LISTWISE.'],
   ['p','<b>預檢資料</b>是 SPSS 裡最被低估的功能：描述統計、盒鬚圖、莖葉圖、Q-Q 圖、常態性檢定、離群值編號，一個指令全出來。做任何正式分析前先跑它。']]}),
 ],
 quiz:[
  {q:'某班反應時間資料：M = 620 ms，Mdn = 540 ms。關於這個分配最合理的推論是？',
   opts:['資料呈負偏（左尾長）','資料呈正偏（右尾長）','資料是常態的','一定有輸入錯誤'],a:1,
   why:'平均數被拉到中位數的右邊，代表右側有少數很大的值把平均數往上拖 → <b>正偏</b>。反應時間資料典型就長這樣，所以心理學常改用中位數或做對數轉換。'},
  {q:'同一組資料，用 STDEV.P 算出來的值會比 STDEV.S：',
   opts:['大一點','小一點','完全一樣','看資料而定'],a:1,
   why:'分母 <i>n</i> 比 <i>n</i> − 1 大，所以 STDEV.P 的結果一定比較<b>小</b>。樣本越小差距越明顯：n = 10 時差約 5%。做研究要估母體，請用 STDEV.S。'},
  {q:'把一組分數每個人都加 5 分，下列哪個統計量不會改變？',
   opts:['平均數','中位數','標準差','最大值'],a:2,
   why:'整體平移不改變分數之間的「距離」，所以<b>標準差不變</b>（變異數也不變）。集中量數和最大最小值則全部加 5。這也是 z 分數轉換為什麼不會改變分配形狀的原因。'}]},

/* ============ 3 ============ */
{id:3,part:0,title:'看見分配：圖形與離群值',lede:'跑檢定之前先畫圖。圖能一秒看出打錯的資料、雙峰、極端值——這些東西平均數和標準差不會告訴你。',
 mins:14,goals:['直方圖','盒鬚圖','離群值的處理'],body:[
 H('先畫圖，再算檢定'),
 P('1973 年 Anscombe 造了四組資料：平均數、標準差、相關係數、迴歸線<b>全部一模一樣</b>，但畫出來完全不同——一組是漂亮的線性關係，一組是曲線，一組被單一離群值主導。這個例子從此變成「一定要畫圖」的標準論證。'),
 SIM('shape'),
 H('直方圖：組距會騙人'),
 P('直方圖把分數切成區間再數人數。<b>組距（bin width）不是資料的性質，是你的選擇</b>——上面的滑桿拖一拖就會看到：組距太寬，雙峰被抹平；太窄，隨機起伏看起來像結構。預設值只是軟體的猜測，務必自己調一次。'),
 H('盒鬚圖：五個數字說完一個分配'),
 UL(['盒子的上下緣是 <i>Q</i><sub>3</sub> 與 <i>Q</i><sub>1</sub>，中間那條線是<b>中位數</b>（不是平均數）。',
   '盒子的高度就是 <b>IQR</b>。',
   '鬍鬚最遠延伸到 <b>1.5 × IQR</b> 之內的最後一筆真實資料。',
   '超出鬍鬚的點被標成<b>離群值</b>；超過 3 × IQR 的在 SPSS 會標成極端值（星號）。']),
 NOTE('key','盒鬚圖最強的用法','把它和分組變項放在一起（三組並排），你會同時看到三組的中心、散布、偏斜和離群值——這正是變異數分析前該檢查的全部東西。'),
 H('遇到離群值怎麼辦'),
 P('離群值不等於錯誤資料。正確的處理順序是：'),
 OL(['<b>先回去查原始資料。</b>是不是打字打錯（36 打成 360）？是不是量表反向題沒轉？是不是受試者亂答？這類確認得了的錯誤，直接修正或刪除，並在方法中說明。',
   '<b>判斷它是不是屬於你的母體。</b>研究大學生睡眠，卻有一位是輪班護理師——他可能根本不該進樣本。',
   '<b>如果查不出理由，就不要偷偷刪。</b>可行的做法：報告「有／無此觀察值」兩種分析結果；或改用對離群值不敏感的方法（中位數、Spearman 相關、無母數檢定、穩健統計）。',
   '<b>把你的決定寫進論文。</b>「依 1.5 × IQR 準則有 2 筆離群值，經確認為有效資料，故保留；敏感度分析顯示排除後結論不變。」']),
 NOTE('trap','最要避免的事','先跑檢定，發現 p = .07，於是刪掉兩個「礙事」的觀察值讓 p 變成 .04。這是 p-hacking，而且非常容易被審查者抓到（n 和自由度會對不起來）。離群值的處理規則要在看檢定結果<b>之前</b>就決定好。'),
 SOFT({excel:[['h','直方圖'],
   ['path','插入 › 統計圖表 › <b>直方圖</b>（Excel 2016 以後內建）'],
   ['p','畫出來後，右鍵點橫軸 › 座標軸格式 › 可以設定 <b>Bin width</b> 或 <b>Number of bins</b>。這是 Excel 裡少數直接讓你調組距的地方。'],
   ['h','用分析工具箱做次數分配'],
   ['path','資料 › 資料分析 › <b>直方圖</b> ›「輸入範圍」放資料、「組界範圍」放你自訂的上限值欄'],
   ['h','盒鬚圖'],
   ['path','選取資料 › 插入 › 統計圖表 › <b>盒鬚圖</b>'],
   ['p','Excel 的盒鬚圖預設用「排除中位數」的四分位算法，和 SPSS 的算法略有差異，Q1／Q3 可能差一點點。要精確對照請用 <code>QUARTILE.INC</code> 自己算。']],
  jasp:[['ol',['<b>Descriptives</b> › <b>Descriptives</b>，變項拉進 Variables。',
   '展開 <b>Plots</b>：勾 <b>Distribution plots</b>（直方圖＋密度曲線）。',
   '勾 <b>Boxplots</b>，再勾 <b>Label outliers</b>，離群值旁邊會直接標出列號。',
   '要分組比較：把 <code>group</code> 拉進 <b>Split</b>，盒鬚圖就會三組並排。',
   '想同時看每個點：在 Boxplots 下面勾 <b>Jitter element</b>，也可以取消 Boxplot element 改成只看小提琴圖。']],
   ['p','JASP 的 Q-Q 圖在同一個 Plots 面板（<b>Q-Q plots</b>），第 15 關會用到。']],
  spss:[['h','最快的方式'],
   ['path','分析 › 敘述統計 › <b>預檢資料</b> › 依變數清單放 mem、因子清單放 group › 圖形：勾「含檢定的常態圖」'],
   ['h','圖表建立器'],
   ['path','圖形 › <b>圖表建立器</b> › 選 Histogram 或 Boxplot › 拖曳變項到座標軸'],
   ['h','語法'],
   ['code','EXAMINE VARIABLES=mem BY group\n  /PLOT=BOXPLOT HISTOGRAM NPPLOT\n  /STATISTICS=DESCRIPTIVES EXTREME\n  /NOTOTAL.\n\nGRAPH /HISTOGRAM(NORMAL)=mem.'],
   ['p','<code>/STATISTICS=EXTREME</code> 會列出最高與最低各 5 筆的<b>觀察值編號</b>，是回頭查原始資料最快的入口。SPSS 盒鬚圖上的數字就是這個編號。']]}),
 ],
 quiz:[
  {q:'盒鬚圖中間那條橫線代表什麼？',
   opts:['平均數','中位數','眾數','平均數 ± 1 SD'],a:1,
   why:'盒鬚圖完全建立在<b>次序統計量</b>上：中位數、Q1、Q3。它刻意不用平均數，才能不受極端值影響。'},
  {q:'你把直方圖的組距從 5 改成 1，原本平滑的單峰變成好幾個高低起伏。最合理的解讀是？',
   opts:['資料真的是多峰的','組距太窄，看到的是抽樣隨機波動','資料不是常態分配','樣本數不夠，應該重新收資料'],a:1,
   why:'組距越窄，每格人數越少，隨機波動的比例就越大。判斷分配形狀時應該<b>看好幾種組距都穩定存在的特徵</b>，只在一種組距下出現的結構通常是雜訊。'},
  {q:'資料中有一筆睡眠時數是 25 小時。最適當的第一步是？',
   opts:['直接刪除這筆資料','改用無母數檢定','回查原始問卷，判斷是輸入錯誤還是受試者誤解題意','保留它，因為刪資料不道德'],a:2,
   why:'一天不可能睡 25 小時，這是<b>不可能值</b>，幾乎確定是輸入或填答錯誤。先回查來源才知道該修正、改為遺漏值，還是排除該受試者——不能直接刪，也不能當沒看到。'}]},

/* ============ 4 ============ */
{id:4,part:1,title:'常態分配與 z 分數',lede:'常態分配之所以重要，不是因為心理變項都常態，而是因為「樣本平均數」的分配幾乎總是常態。這一關先把工具練熟。',
 mins:15,goals:['常態曲線','z 分數','機率＝面積'],body:[
 H('機率就是曲線底下的面積'),
 P('常態分配由兩個參數完全決定：平均數 <i>μ</i> 決定它站在哪裡，標準差 <i>σ</i> 決定它有多胖。曲線底下的總面積是 1，任何一段區間的面積就是落在那個區間的機率。'),
 SIM('znorm'),
 H('經驗法則 68–95–99.7'),
 UL(['<i>μ</i> ± 1<i>σ</i> 涵蓋約 <b>68%</b> 的人',
   '<i>μ</i> ± 2<i>σ</i> 涵蓋約 <b>95%</b>（精確一點是 ±1.96<i>σ</i>）',
   '<i>μ</i> ± 3<i>σ</i> 涵蓋約 <b>99.7%</b>']),
 P('上面的模擬器把滑桿拉到 ±1.96 試試，右上角的面積會顯示 0.950。這個 1.96 之後會在信賴區間、臨界值、顯著性判準裡不斷出現——它就是「雙尾 5%」的代號。'),
 H('z 分數：把任何分數翻譯成同一種語言'),
 FML('<i>z</i> = <span class="frac"><span class="n"><i>X</i> − <i>μ</i></span><span class="d"><i>σ</i></span></span>','這個分數距離平均數幾個標準差'),
 P('z 分數回答一個問題：<b>這個人在他那群人裡站在哪</b>。它讓不同量表可以直接比較。'),
 TBL(['情境','原始分數','該分配','z 分數','解讀'],[
  ['記憶測驗','48 分','<i>M</i> = 37.15, <i>SD</i> = 6.74','+1.61','高於平均 1.6 個標準差，約在第 95 百分位'],
  ['焦慮前測','44 分','<i>M</i> = 52.60, <i>SD</i> = 6.67','−1.29','低於平均 1.3 個標準差，約在第 10 百分位'],
  ['睡眠時數','5.0 小時','<i>M</i> = 6.68, <i>SD</i> = 1.14','−1.48','偏短，約在第 7 百分位']],'表 4　本課程資料裡同一位受試者的三種分數，轉成 z 後才能互相比較'),
 NOTE('key','z 轉換不會讓資料變常態','z 分數只是平移＋縮放，分配的<b>形狀完全不變</b>。偏斜的資料轉成 z 之後還是一樣偏斜。想改變形狀要做的是資料轉換（取對數、平方根），那是另一回事。'),
 H('標準分數的親戚'),
 UL(['<b>T 分數</b> = 50 + 10<i>z</i>：臨床量表常用（MMPI、CBCL），避免負數。',
   '<b>IQ 分數</b> = 100 + 15<i>z</i>：韋氏智力量表的定義方式。',
   '<b>百分等級 PR</b>：低於此分數的人所佔百分比，就是 z 左邊的面積。']),
 SOFT({excel:[['h','常態機率'],
   ['code','=NORM.DIST(48, 37.15, 6.74, TRUE)  &lt;- 小於 48 分的機率（累積）\n=NORM.DIST(48, 37.15, 6.74, FALSE) &lt;- 該點的機率密度（畫圖用）\n=NORM.S.DIST(1.96, TRUE)          &lt;- 標準常態，z 左側面積 = 0.9750\n=1 - NORM.S.DIST(1.96, TRUE)      &lt;- 右尾面積 = 0.0250'],
   ['h','反過來：已知機率求分數'],
   ['code','=NORM.S.INV(0.975)           &lt;- 得到 1.959964（那個 1.96）\n=NORM.INV(0.90, 37.15, 6.74) &lt;- 記憶測驗的第 90 百分位分數'],
   ['h','z 分數'],
   ['code','=STANDARDIZE(D2, AVERAGE($D$2:$D$61), STDEV.S($D$2:$D$61))\n=(D2 - AVERAGE($D$2:$D$61)) / STDEV.S($D$2:$D$61)   &lt;- 同樣的東西']],
  jasp:[['h','把整欄轉成 z'],
   ['ol',['在資料檢視最右邊點 <b>+</b> 新增一個 Computed Column，命名 zmem。',
    '選 <b>R</b> 模式，輸入 <code>scale(mem)</code>；或選拖曳模式，用內建函數 <b>zScores</b>。',
    '按 <b>Compute column</b>。']],
   ['h','查常態分配的機率'],
   ['p','JASP 沒有內建機率計算機，但 Computed Column 可以直接寫 R：<code>pnorm(1.96)</code>、<code>qnorm(0.975)</code>。'],
   ['h','把常態曲線疊在直方圖上'],
   ['p','Descriptives › Plots › <b>Distribution plots</b> 會自動疊一條核密度曲線；要理論常態曲線請到 Q-Q plots 看直線程度。']],
  spss:[['h','存 z 分數'],
   ['path','分析 › 敘述統計 › 描述性統計量 › 勾左下角「<b>將標準化的數值存成變數</b>」'],
   ['p','SPSS 會在資料檔最右邊自動新增 <code>Zmem</code> 這樣的欄位。'],
   ['h','用轉換計算機率'],
   ['path','轉換 › <b>計算變數</b> › 函數群組選「CDF 與非集中 CDF」'],
   ['code','COMPUTE p_less = CDF.NORMAL(48, 37.15, 6.74).\nCOMPUTE z_crit = IDF.NORMAL(0.975, 0, 1).   /* 1.96 */\nCOMPUTE zmem   = (mem - 37.15) / 6.74.\nEXECUTE.'],
   ['p','SPSS 的命名邏輯：<code>CDF.xxx</code> 是累積機率（給分數求機率），<code>IDF.xxx</code> 是反函數（給機率求分數）。t、F、卡方都有對應版本：<code>CDF.T</code>、<code>IDF.F</code>、<code>CDF.CHISQ</code>。']]}),
 ],
 quiz:[
  {q:'某量表 M = 100, SD = 15。一位受試者得 130 分，他的 z 分數與大約百分等級是？',
   opts:['z = 2.0，PR ≈ 98','z = 2.0，PR ≈ 95','z = 1.5，PR ≈ 93','z = 30，PR ≈ 99'],a:0,
   why:'z = (130 − 100)/15 = 2.0。標準常態下 z = 2 左側面積 ≈ .9772，所以 PR ≈ 98。注意 ±2 SD 涵蓋 95% 是<b>雙尾</b>，單側只有 2.3% 在外面。'},
  {q:'一組明顯右偏的反應時間資料，全部轉成 z 分數後，分配形狀會：',
   opts:['變成常態','變成左偏','維持右偏','變成均勻分配'],a:2,
   why:'z 轉換是線性轉換（減一個數、除一個數），只會平移與縮放，<b>不改變形狀</b>。想拉直右偏分配得用對數或平方根等非線性轉換。'},
  {q:'在 Excel 裡要算「標準常態下右尾 2.5% 對應的 z 值」，正確寫法是：',
   opts:['=NORM.S.DIST(0.975, TRUE)','=NORM.S.INV(0.975)','=NORM.INV(0.025, 0, 1)','=STANDARDIZE(0.975, 0, 1)'],a:1,
   why:'右尾 2.5% ⇒ 左側累積 97.5% ⇒ 要的是<b>反函數</b> <code>NORM.S.INV(0.975)</code> = 1.96。<code>NORM.S.DIST</code> 是反方向（給 z 求機率）。'}]},

/* ============ 5 ============ */
{id:5,part:1,title:'抽樣分配與中央極限定理',lede:'這是整門統計學的樞紐。看懂這一關，後面所有檢定都只是同一件事的不同包裝。',
 mins:18,goals:['抽樣分配','標準誤','中央極限定理'],body:[
 H('三種分配，千萬別混在一起'),
 TBL(['分配','它描述什麼','散布程度','實際存在嗎'],[
  ['<b>母體分配</b>','全台灣大學生的睡眠時數','<i>σ</i>','存在，但你看不到'],
  ['<b>樣本分配</b>','你收到的那 60 個人的睡眠時數','<i>s</i>','你手上就是這個'],
  ['<b>抽樣分配</b>','「重複抽 60 人、每次算出的平均數」的分配','<i>SE</i> = <i>σ</i>/√<i>n</i>','理論上的，只抽一次也照樣存在']],
  '表 5　統計學最容易搞混的三個詞'),
 NOTE('key','關鍵轉折','你只抽一次樣，怎麼會知道「重複抽很多次會長怎樣」？答案是：<b>數學可以告訴你</b>。這就是中央極限定理的價值——不用真的重複抽樣，就能知道抽樣分配的形狀與寬度。'),
 H('親手做一次：抽樣分配長出來的過程'),
 P('下面的模擬器可以選母體的形狀（包括非常不常態的）。每按一次「抽 1 次」，就從母體抽 <i>n</i> 個人、算出平均數、把它丟進下面的直方圖。抽個幾百次，看看下面那個分配變成什麼形狀。'),
 SIM('clt'),
 H('中央極限定理說了什麼'),
 P('不論母體是什麼形狀，只要樣本數 <i>n</i> 夠大，<b>樣本平均數的抽樣分配會趨近常態</b>，而且：'),
 FML('<i>μ</i><sub><i>M</i></sub> = <i>μ</i>　　<i>SE</i> = <span class="frac"><span class="n"><i>σ</i></span><span class="d">√<i>n</i></span></span>','抽樣分配的中心等於母體平均數，寬度是標準誤'),
 UL(['抽樣分配的<b>中心</b>就在母體平均數上——樣本平均數是不偏估計。',
   '抽樣分配的<b>寬度</b>是 <i>σ</i>/√<i>n</i>，叫做<b>標準誤 (standard error)</b>。',
   '母體越常態，需要的 <i>n</i> 越小；母體越偏斜，需要的 <i>n</i> 越大。<b>n ≥ 30</b> 是常見的粗略門檻，但對極端偏斜的母體並不夠。']),
 NOTE('warn','標準差 vs 標準誤','<b>SD 描述「人」有多不一樣，SE 描述「平均數」有多不準。</b>兩者差一個 √n。論文寫 M (SD) 是在描述樣本；誤差長條畫 SE 是在表達估計精確度。把 SE 當成 SD 報告，會讓變異看起來小很多——這是審查者最常抓到的錯誤之一。'),
 H('√n 的實際意義'),
 P('標準誤和 √<i>n</i> 成反比，這有個很現實的後果：<b>要把估計精確度提高一倍，樣本數要變成四倍。</b>從 25 人加到 100 人，SE 減半；再想減半就要 400 人。這是為什麼「再多收一點人」常常不划算，而改善測量工具的信度往往更有效。'),
 TBL(['樣本數 n','√n','SE = σ/√n（設 σ = 10）'],[
  ['10','3.16','3.16'],['25','5.00','2.00'],['50','7.07','1.41'],
  ['100','10.00','1.00'],['400','20.00','0.50']],'表 6　樣本數與標準誤'),
 SOFT({excel:[['h','標準誤'],
   ['code','=STDEV.S(D2:D61) / SQRT(COUNT(D2:D61))'],
   ['p','分析工具箱的「敘述統計」輸出裡，<b>標準誤</b>就是第二列（Standard Error）。'],
   ['h','自己做一次抽樣模擬'],
   ['ol',['在 A 欄用 <code>=NORM.INV(RAND(), 6.7, 1.1)</code> 產生 30 個亂數，模擬一次抽樣。',
    'B1 放 <code>=AVERAGE(A1:A30)</code>，這是一次的樣本平均數。',
    '把 B1 往下複製 500 列？不行——要用<b>資料表</b>：資料 › 模擬分析 › <b>運算列表</b>，或按 F9 重算後手動記錄。',
    '最省事的做法是把 A1:A30 複製成 500 欄（A 到 SF），每欄底下算一次平均數，再對那 500 個平均數畫直方圖。']],
   ['p','按 <b>F9</b> 會重新抽一次。多按幾次看每次的平均數跳動多大——那個跳動範圍就是標準誤。']],
  jasp:[['p','JASP 沒有內建抽樣模擬，但它的 <b>Learn Bayes</b> 與 <b>Distributions</b> 模組（在 <b>+</b> 選單裡打開）提供互動式的分配示範。'],
   ['ol',['右上角 <b>+</b> › 勾選 <b>Distributions</b> 模組。',
    '選 <b>Normal</b>，可以在 Display 面板同時看理論密度與模擬樣本的直方圖。',
    '調整 n 觀察樣本直方圖與理論曲線的貼合程度。']],
   ['h','實務上你需要的只是 SE'],
   ['p','任何 T-Test 或 Descriptives 的輸出，勾 <b>Std. error of mean</b> 就會出現；Descriptives Plots 的誤差長條預設畫的就是 95% CI（以 SE 為單位）。']],
  spss:[['h','算標準誤'],
   ['path','分析 › 敘述統計 › 描述性統計量 › 選項 › 勾「<b>平均數的標準誤</b>」'],
   ['h','用語法做抽樣模擬'],
   ['code','/* 產生 500 個樣本、每個 n=30 的平均數 */\nINPUT PROGRAM.\nLOOP #rep = 1 TO 500.\n  COMPUTE total = 0.\n  LOOP #i = 1 TO 30.\n    COMPUTE total = total + RV.NORMAL(6.7, 1.1).\n  END LOOP.\n  COMPUTE xbar = total / 30.\n  END CASE.\nEND LOOP.\nEND FILE.\nEND INPUT PROGRAM.\nEXECUTE.\n\nFREQUENCIES VARIABLES=xbar /HISTOGRAM NORMAL\n  /STATISTICS=MEAN STDDEV.'],
   ['p','跑完之後看 <code>xbar</code> 的標準差——它應該非常接近 1.1/√30 = 0.20，也就是理論標準誤。這段語法值得自己跑一次，會很有感。']]}),
 ],
 quiz:[
  {q:'母體 σ = 12。若樣本數從 36 增加到 144，標準誤會變成原來的幾倍？',
   opts:['1/4','1/2','2 倍','不變'],a:1,
   why:'SE = σ/√n。√36 = 6，√144 = 12，分母變兩倍，所以 SE <b>減半</b>。樣本數要變四倍才能讓精確度提升一倍——這是 √n 定律。'},
  {q:'母體分配嚴重右偏。以下敘述何者正確？',
   opts:['樣本分配會隨 n 增大而變常態','樣本平均數的抽樣分配會隨 n 增大而趨近常態','必須改用無母數檢定，中央極限定理不適用','抽樣分配的中心會偏離母體平均數'],a:1,
   why:'中央極限定理講的是<b>抽樣分配</b>（樣本平均數的分配），不是樣本本身的分配。你手上那 200 個人的分數還是會右偏，但他們的平均數在重複抽樣下會呈常態。'},
  {q:'一篇論文報告「M = 42.3, SE = 0.8, n = 100」。這組人的標準差大約是？',
   opts:['0.08','0.8','8.0','80'],a:2,
   why:'SE = SD/√n ⇒ SD = SE × √n = 0.8 × 10 = <b>8.0</b>。看到 SE 時養成回推 SD 的習慣，才不會被小小的誤差長條誤導。'}]},

/* ============ 6 ============ */
{id:6,part:1,title:'信賴區間',lede:'點估計告訴你一個數字，區間估計告訴你這個數字有多可靠。近年心理學期刊要求：能報 CI 就不要只報 p。',
 mins:15,goals:['95% CI 的算法','正確的解讀','為什麼不是機率'],body:[
 H('從一個數字變成一段範圍'),
 P('你的樣本平均睡眠 6.68 小時。母體平均是 6.68 嗎？幾乎確定不是——只是剛好抽到這批人。信賴區間的工作是：<b>圈出一段範圍，讓這個程序長期而言有 95% 的機會圈到真值</b>。'),
 FML('CI<sub>95</sub> = <i>M</i> ± <i>t</i><sub>.975,<i>df</i></sub> × <span class="frac"><span class="n"><i>s</i></span><span class="d">√<i>n</i></span></span>','點估計 ± 臨界值 × 標準誤'),
 P('三個零件：<b>中心</b>是你的點估計；<b>標準誤</b>是抽樣分配的寬度；<b>臨界值</b>決定你要多有把握。95% 對應 <i>t</i> ≈ 2.0（大樣本時趨近 1.96），99% 對應 ≈ 2.6。'),
 H('親眼看一次「95%」是什麼意思'),
 P('下面每一條橫線是一次獨立抽樣算出的 95% CI。垂直虛線是真正的母體平均數（模擬器知道，現實中你不知道）。按「跑 100 次」，數數看有幾條沒有蓋到真值。'),
 SIM('ci'),
 NOTE('trap','最常見的誤解','「母體平均數有 95% 的機率落在這個區間內」——<b>錯</b>。母體平均數是固定的常數，它要嘛在區間裡、要嘛不在，沒有機率可言。會變動的是<b>區間</b>（每次抽樣都會得到不同的區間）。正確說法是：<b>用這個程序重複抽樣，95% 的區間會蓋住母體平均數。</b>'),
 H('怎麼在論文裡讀 CI'),
 UL(['<b>區間寬度</b>＝估計精確度。很寬代表「我們其實不太確定」，通常是 n 太小或變異太大。',
   '<b>區間有沒有跨過 0</b>（對差異而言）＝等價於雙尾 <i>p</i> 是否小於 .05。95% CI 不含 0 ⟺ <i>p</i> &lt; .05。',
   '<b>區間的兩端各代表什麼</b>：如果最樂觀的一端（例如差異 0.3 分）在實務上仍然微不足道，那麼即使顯著也沒什麼意義。這是 CI 比 p 值有用的地方。']),
 H('信心水準的取捨'),
 TBL(['信心水準','臨界 t（df = 59）','區間相對寬度','代價'],[
  ['90%','1.671','窄','較容易漏掉真值'],
  ['95%','2.001','標準','心理學慣例'],
  ['99%','2.662','寬 33%','很有把握，但幾乎什麼都包進去了']],'表 7　想更有把握，就得接受更寬的區間'),
 P('沒有「比較好」的信心水準，只有取捨。95% 是慣例，不是真理。'),
 SOFT({excel:[['h','直接算誤差界限'],
   ['code','=CONFIDENCE.T(0.05, STDEV.S(D2:D61), COUNT(D2:D61))\n  &lt;- 回傳 ± 的那個量（margin of error）\n\n平均數 = AVERAGE(D2:D61)\n下界   = AVERAGE(D2:D61) - CONFIDENCE.T(0.05, STDEV.S(D2:D61), COUNT(D2:D61))\n上界   = AVERAGE(D2:D61) + CONFIDENCE.T(0.05, STDEV.S(D2:D61), COUNT(D2:D61))'],
   ['h','自己拆開算（推薦，看得懂每一塊）'],
   ['code','SE   = STDEV.S(D2:D61)/SQRT(COUNT(D2:D61))\ntcrit= T.INV.2T(0.05, COUNT(D2:D61)-1)\n下界 = AVERAGE(D2:D61) - tcrit*SE'],
   ['p','注意 <code>CONFIDENCE.NORM</code> 用的是 z 而非 t，只有在 σ 已知或 n 很大時才適用。做研究請用 <b>CONFIDENCE.T</b>。']],
  jasp:[['p','JASP 幾乎每個分析都內建 CI，只要把它勾出來：'],
   ['ol',['<b>Descriptives</b>：Statistics 面板 › 勾 <b>Confidence interval for mean</b>，可設定 95%。',
    '<b>T-Tests</b>：Additional Statistics › 勾 <b>Location parameter</b> 與 <b>Confidence interval</b>，會給「平均數差」的 CI（這才是你要報告的）。',
    '<b>Effect size</b> 旁邊也可以勾 CI，得到 Cohen\'s d 的信賴區間。',
    '<b>Linear Regression</b>：Statistics › 勾 <b>Confidence intervals</b>，每個迴歸係數都會有 CI。']],
   ['p','JASP 的 Descriptives Plots 誤差長條預設就是 95% CI，不是 SE——圖說要寫清楚。']],
  spss:[['h','單一變項的 CI'],
   ['path','分析 › 敘述統計 › <b>預檢資料</b> › 統計量 › 「平均數的信賴區間 95%」（預設就有）'],
   ['path','分析 › 比較平均數法 › <b>單一樣本 T 檢定</b>（輸出表格右邊直接給差異的 CI）'],
   ['h','語法'],
   ['code','EXAMINE VARIABLES=sleep\n  /STATISTICS DESCRIPTIVES\n  /CINTERVAL 95.\n\nT-TEST /TESTVAL=7 /VARIABLES=sleep /CRITERIA=CI(.95).'],
   ['p','⚠️ SPSS 的單一樣本 T 檢定表格裡，CI 那兩欄是<b>「平均數 − 檢定值」的差</b>的信賴區間，不是平均數本身的區間。想要平均數的 CI 請用<b>預檢資料</b>。這個細節每年都有人搞錯。']]}),
 ],
 quiz:[
  {q:'某研究報告「介入效果的 95% CI = [−0.4, 5.8]」。可以推論什麼？',
   opts:['效果顯著，p < .05','效果不顯著，因為區間包含 0','母體效果有 95% 機率介於 −0.4 到 5.8','樣本數太小，結果不可用'],a:1,
   why:'差異的 95% CI <b>包含 0</b>，等價於雙尾 p ≥ .05，不顯著。但注意區間上端到 5.8，代表「效果可能還不小」也沒被排除——所以正確結論是「證據不足」，不是「沒有效果」。'},
  {q:'其他條件不變，把信心水準從 95% 提高到 99%，區間會：',
   opts:['變窄','變寬','不變','先變窄再變寬'],a:1,
   why:'要更有把握圈到真值，就必須圈得更大。臨界 t 從 ≈2.0 變成 ≈2.66，區間<b>變寬</b>約三分之一。精確度與信心永遠是取捨。'},
  {q:'在 SPSS 的「單一樣本 T 檢定」輸出中，最右邊的 95% 信賴區間指的是：',
   opts:['樣本平均數的信賴區間','母體標準差的信賴區間','平均數與檢定值之差的信賴區間','效果量的信賴區間'],a:2,
   why:'SPSS 這張表的 CI 是<b>差異</b>（Mean Difference）的區間，所以看它有沒有包含 <b>0</b>。想要平均數本身的區間，得跑「預檢資料」。'}]},

/* ============ 7 ============ */
{id:7,part:1,title:'假設檢定的邏輯與 p 值',lede:'p 值大概是整個科學裡最常被誤用的數字。這一關把它的定義一字不漏地講清楚，然後練到能自己抓錯。',
 mins:18,goals:['虛無假設','p 值的正確定義','兩類錯誤'],body:[
 H('整套流程長這樣'),
 OL(['<b>設定假設。</b><i>H</i><sub>0</sub>（虛無假設）：沒有差異、沒有關聯。<i>H</i><sub>1</sub>（對立假設）：有差異。注意 <i>H</i><sub>0</sub> 永遠是「等於」，因為只有明確的數值才能算出機率。',
   '<b>選定 α。</b>心理學慣例 α = .05，意思是「我願意承擔 5% 的機率在 H₀ 為真時誤判為有效」。這個數字要在看資料<b>之前</b>決定。',
   '<b>計算檢定統計量。</b>幾乎所有檢定都是同一個形狀：<b>（你觀察到的效果）÷（這個效果的標準誤）</b>。t、F、z、χ² 都是這個模式的變體。',
   '<b>算出 p 值。</b>在 H₀ 為真的世界裡，得到「像這樣或更極端」的結果的機率。',
   '<b>做決定。</b>p &lt; α → 拒絕 H₀；p ≥ α → 無法拒絕 H₀。',
   '<b>報告效果量與 CI。</b>光有 p 值的結果在今天的期刊會被退回。']),
 H('p 值到底是什麼：一次講完'),
 NOTE('key','定義','<b><i>p</i> 值 ＝ 假設虛無假設為真，觀察到目前這個結果或更極端結果的機率。</b>每一個字都重要：它是「在 H₀ 為真的條件下」的機率，而且包含「更極端」的所有情況。'),
 P('把滑桿拉一拉，看兩件事怎麼同時變：樣本平均數離 H₀ 越遠、或標準誤越小，t 值越大，尾端塗色的面積（p 值）就越小。'),
 SIM('pval'),
 H('p 值不是什麼'),
 TBL(['常見說法','對不對','為什麼'],[
  ['p 是 H₀ 為真的機率','✗','p 是「假設 H₀ 為真」之下的機率，不是 H₀ 的機率。要算後者需要貝氏方法。'],
  ['p = .03 表示效果有 97% 的機率是真的','✗','同上，方向反了。這叫「條件機率倒置」謬誤。'],
  ['p 越小效果越大','✗','p 同時受效果大小與樣本數影響。n = 5000 時，一個微不足道的差異也能 p &lt; .001。'],
  ['p = .06 表示沒有效果','✗','只代表「證據不足以拒絕 H₀」，不等於證明 H₀ 為真。不顯著 ≠ 沒有效果。'],
  ['p &lt; .05 時拒絕 H₀','✓','這就是它的用法，僅此而已。']],'表 8　p 值的五個常見說法'),
 H('兩類錯誤'),
 TBL(['','H₀ 其實為真','H₀ 其實為假'],[
  ['<b>你拒絕 H₀</b>','<span style="color:var(--bad)">型一錯誤 α</span><br>誤報：說有效，其實沒效','<span style="color:var(--good)">正確 (1 − β)</span><br>檢定力'],
  ['<b>你保留 H₀</b>','<span style="color:var(--good)">正確 (1 − α)</span>','<span style="color:var(--bad)">型二錯誤 β</span><br>漏報：說沒效，其實有效']],'表 9　決策與真相的四種組合'),
 P('α 是你自己設的（.05），β 則取決於效果大小、樣本數與變異——下一關會處理。兩者互相拉扯：把 α 壓到 .01 可以減少誤報，但漏報會變多。'),
 NOTE('warn','多重比較：α 會累積','做一次檢定，誤報機率 5%。做 20 次獨立檢定，至少誤報一次的機率是 1 − .95²⁰ = <b>64%</b>。這就是為什麼變異數分析後的事後比較要校正（Bonferroni、Tukey），也是為什麼「把所有變項兩兩相關跑一遍，挑顯著的來寫」是不可接受的作法。'),
 H('單尾還是雙尾'),
 P('雙尾檢定問「有沒有差異」，單尾問「是不是比較大」。單尾的臨界值比較寬鬆，比較容易顯著——正因如此，<b>只有在你能事先、基於理論、排除相反方向的可能時才可以用單尾</b>，而且必須事先登錄。看到資料是往右偏才改成單尾，是標準的 p-hacking。心理學實務上，雙尾是預設。'),
 SOFT({excel:[['h','從檢定統計量求 p 值'],
   ['code','=T.DIST.2T(ABS(t), df)     &lt;- 雙尾 p\n=T.DIST.RT(t, df)          &lt;- 右尾單尾 p\n=F.DIST.RT(F, df1, df2)    &lt;- ANOVA 的 p（F 一律右尾）\n=CHISQ.DIST.RT(x2, df)     &lt;- 卡方的 p\n=2*(1-NORM.S.DIST(ABS(z),TRUE))  &lt;- z 檢定的雙尾 p'],
   ['h','臨界值'],
   ['code','=T.INV.2T(0.05, 59)   &lt;- 2.0010，雙尾 5% 的 t 臨界值\n=F.INV.RT(0.05, 2, 57) &lt;- ANOVA 的 F 臨界值'],
   ['p','Excel 的命名規則：<code>.DIST</code> 給統計量求機率，<code>.INV</code> 給機率求統計量；<code>2T</code> 是雙尾、<code>RT</code> 是右尾。']],
  jasp:[['p','JASP 所有檢定的輸出都直接給 p 值，且<b>小數點後三位</b>，小於 .001 時顯示 <code>&lt; .001</code>——這正好就是 APA 的寫法，可以直接抄。'],
   ['h','把預設改成你要的'],
   ['ol',['右上 ☰ › <b>Preferences</b> › <b>Results</b>。',
    '可以設定「Display exact p-values」（顯示到更多位數）。',
    '也可以把所有表格改成 APA 格式輸出。']],
   ['h','JASP 的貝氏因子'],
   ['p','每個古典檢定旁邊都有一個 Bayesian 版本（例如 Bayesian Independent Samples T-Test）。它給的 <b>BF₁₀</b> 可以量化「支持 H₁ 相對於 H₀ 的證據強度」，而且<b>能支持虛無假設</b>——這是 p 值做不到的。不顯著的結果特別值得加報 BF₁₀。']],
  spss:[['p','SPSS 的 p 值在輸出表格裡叫「<b>顯著性</b>」或 Sig.，有時寫成 Sig. (2-tailed)。'],
   ['h','⚠️ 三個判讀陷阱'],
   ['ul',['SPSS 舊版顯示 <code>.000</code>，這<b>不是</b> p = 0，而是「小於 .0005」。論文要寫 <b>p &lt; .001</b>，絕對不要寫 p = .000。',
    '雙擊表格 › 儲存格格式可以增加小數位數，看到真實的值。',
    'SPSS 27 以後的 t 檢定表會同時給單尾與雙尾 p，別選錯欄。']],
   ['h','自己算 p 值'],
   ['code','COMPUTE p2 = 2 * (1 - CDF.T(ABS(tvalue), 58)).\nCOMPUTE pF = 1 - CDF.F(Fvalue, 2, 57).\nCOMPUTE pX = 1 - CDF.CHISQ(chi, 2).\nEXECUTE.']]}),
 ],
 quiz:[
  {q:'一份研究得到 p = .02。下列哪一個是對 p 值正確的陳述？',
   opts:['虛無假設為真的機率是 2%','如果虛無假設為真，得到這麼極端或更極端結果的機率是 2%','對立假設為真的機率是 98%','重複實驗有 98% 會得到顯著結果'],a:1,
   why:'p 值是<b>條件機率</b>：條件是「H₀ 為真」，事件是「觀察到這麼極端或更極端的資料」。選項 A、C 把條件與事件倒過來；選項 D 是把 p 值誤當成檢定力。'},
  {q:'研究者跑了 20 個兩兩相關檢定，有 1 個達到 p < .05，於是寫成主要發現。主要問題是：',
   opts:['樣本數不足','型一錯誤膨脹（多重比較未校正）','應該用單尾檢定','相關不能推論因果'],a:1,
   why:'20 次獨立檢定下，至少出現一個假顯著的機率高達 64%。必須做多重比較校正（Bonferroni、Holm、FDR），或事先登錄要檢驗哪一個相關。'},
  {q:'一位研究者原本設定雙尾檢定，看到 p = .08 且方向符合預期，於是改成單尾報告 p = .04。這樣做：',
   opts:['可以，因為方向本來就有理論預期','可以，只要在論文中說明','不可以，這是事後改變分析決策的 p-hacking','不可以，因為單尾檢定不被心理學接受'],a:2,
   why:'單尾檢定本身是合法的，問題在於<b>看了資料才決定</b>。這讓實際的型一錯誤率遠高於 .05。合法的作法是在收資料前（最好是預先登錄）就確定單尾方向。'}]},

/* ============ 8 ============ */
{id:8,part:1,title:'效果量與統計檢定力',lede:'p 值只說「有沒有」，效果量說「有多大」。而檢定力決定你這個研究一開始有沒有機會發現它。',
 mins:16,goals:["Cohen's d",'η²、r²','事前檢定力分析'],body:[
 H('為什麼一定要報效果量'),
 P('APA 出版手冊從第 5 版開始要求報告效果量，第 7 版更嚴格。理由很簡單：<b>p 值會被樣本數綁架</b>。n = 20 時的 p = .30 和 n = 2000 時的 p = .001，效果可能一樣大。效果量把樣本數的影響拿掉，只剩下「差異相對於變異有多大」。'),
 H('比較平均數：Cohen\'s d'),
 FML('<i>d</i> = <span class="frac"><span class="n"><i>M</i><sub>1</sub> − <i>M</i><sub>2</sub></span><span class="d"><i>s</i><sub>pooled</sub></span></span>','兩組差幾個標準差'),
 TBL(['<i>d</i>','慣例標籤','重疊程度','心理學裡的例子'],[
  ['0.2','小','兩組分配重疊約 85%','多數人格特質的性別差異'],
  ['0.5','中','重疊約 67%','典型的心理治療 vs 無治療'],
  ['0.8','大','重疊約 53%','記憶測驗中複誦 vs 不複誦'],
  ['1.5','很大','重疊約 30%','本課程資料中控制組 vs 睡眠限制組']],'表 10　Cohen 的慣例標籤'),
 NOTE('warn','別把標籤當成定律','Cohen 本人明確說過這些門檻是「在沒有更好參考點時的權宜之計」。正確做法是拿你的 d 和<b>同領域既有研究的 d</b> 比較。在教育介入裡 d = 0.3 可能就很了不起；在知覺實驗裡 d = 0.8 可能只是普通。'),
 H('其他常見的效果量'),
 TBL(['檢定','效果量','小／中／大','意義'],[
  ['t 檢定','Cohen\'s <i>d</i>','.20 / .50 / .80','差幾個標準差'],
  ['成對 t','<i>d</i><sub>z</sub>','.20 / .50 / .80','用差異分數的 SD 當分母'],
  ['ANOVA','<i>η</i><sup>2</sup>（eta 平方）','.01 / .06 / .14','依變項變異中有多少比例由自變項解釋'],
  ['ANOVA','<i>ω</i><sup>2</sup>（omega 平方）','同上','η² 的不偏版本，小樣本時更準'],
  ['多因子 ANOVA','partial <i>η</i><sup>2</sup>','同上','排除其他因子後的解釋比例（不要跨研究直接比）'],
  ['相關','<i>r</i>','.10 / .30 / .50','本身就是效果量'],
  ['迴歸','<i>R</i><sup>2</sup>','.02 / .13 / .26','所有預測變項共同解釋的變異比例'],
  ['卡方','Cramér\'s <i>V</i>','.10 / .30 / .50','列聯表的關聯強度']],'表 11　效果量對照表（可以收藏這張）'),
 H('檢定力：你有多大機會發現真的存在的效果'),
 P('<b>檢定力 = 1 − β</b>：當效果真的存在時，你的研究能偵測到它（得到顯著結果）的機率。慣例目標是 <b>.80</b>。檢定力由四個東西決定，知道其中三個就能算出第四個：'),
 UL(['<b>α</b>（通常 .05）','<b>效果量</b>（從文獻或前導研究估）','<b>樣本數 n</b>','<b>檢定力 1 − β</b>']),
 P('拖動下面的滑桿，觀察兩件事：上圖兩個分配的重疊區（型二錯誤區）怎麼變化；下面的曲線告訴你要達到 .80 需要多少人。'),
 SIM('power'),
 NOTE('key','最重要的實務結論','小樣本研究的問題不只是「不容易顯著」。檢定力低的研究即使得到顯著結果，那個效果量也<b>幾乎一定被高估</b>（因為只有特別大的估計值才能擠過顯著門檻）。這叫 winner\'s curse，是複製危機的核心機制之一。所以：<b>做研究前先做檢定力分析決定 n</b>，不是做完再補。'),
 NOTE('trap','事後檢定力是沒有意義的','拿你算出來的樣本效果量去反推「本研究的檢定力」（observed power）是一種循環論證——它和 p 值是一對一對應的，不提供任何新資訊。不顯著時寫「本研究檢定力僅 .35，故結果不顯著」等於什麼都沒說。要談檢定力就談<b>事前</b>的、以理論上有意義的最小效果量為基礎的分析。'),
 SOFT({excel:[['h','Cohen\'s d'],
   ['code','n1 = COUNT(組一)   n2 = COUNT(組二)\ns1 = STDEV.S(組一)  s2 = STDEV.S(組二)\nsp = SQRT(((n1-1)*s1^2 + (n2-1)*s2^2) / (n1+n2-2))\nd  = (AVERAGE(組一) - AVERAGE(組二)) / sp'],
   ['h','從 t 值反推 d（讀別人的論文時很好用）'],
   ['code','d = t * SQRT(1/n1 + 1/n2)          &lt;- 獨立樣本\nd = t / SQRT(n)                    &lt;- 成對樣本（得到 dz）\nr = SQRT(t^2 / (t^2 + df))         &lt;- 轉成相關型效果量'],
   ['h','η²'],
   ['code','eta2 = SS_between / SS_total       &lt;- 兩個 SS 都在 ANOVA 輸出表裡'],
   ['p','Excel 沒有檢定力分析功能。請用免費的 <b>G*Power</b>（Heinrich-Heine-Universität 出品），它是心理學界的標準工具。']],
  jasp:[['h','效果量：勾一下就有'],
   ['ol',['T-Tests：Additional Statistics › <b>Effect size</b>（Cohen\'s d），再勾 <b>Confidence interval</b>。',
    'ANOVA：展開 <b>Display</b> 或 Additional Options › 勾 <b>η²</b>、<b>partial η²</b>、<b>ω²</b>。',
    'Regression：Model Summary 表格裡的 <b>R²</b> 與 <b>Adjusted R²</b>。',
    'Contingency Tables：Statistics › <b>Phi and Cramér\'s V</b>。']],
   ['h','JASP 有內建檢定力分析'],
   ['ol',['右上 <b>+</b> › 勾選 <b>Power</b> 模組。',
    '選 <b>Independent Samples T-Test</b>（或其他檢定）。',
    '把 <b>Calculate</b> 設成 <b>Sample size</b>，填入 Power = 0.8、Effect size = 0.5。',
    'JASP 會告訴你每組需要多少人，並畫出檢定力曲線。']],
   ['p','這個 Power 模組讓 JASP 可以取代 G*Power 的大部分日常用途。']],
  spss:[['h','效果量'],
   ['ul',['<b>t 檢定</b>：SPSS 27 以後的輸出會自動附上「效果大小」表格（Cohen\'s d、Hedges\' g、Glass\' delta）。更早的版本要自己算。',
    '<b>ANOVA</b>：一般線性模式 › 選項 › 勾「<b>效果大小估計值</b>」→ 得到 partial η²。',
    '<b>ONEWAY</b> 指令在 v27+ 加上 <code>/ES</code> 次指令。',
    '<b>交叉表</b>：統計量 › 勾 Phi 與 Cramér\'s V。']],
   ['h','語法'],

   opts:['直接說三組兩兩都有差異','做事後比較找出哪幾組不同','改做三次獨立樣本 t 檢定','重新收資料'],a:1,
   why:'整體檢定只告訴你「至少有兩組不同」，不知道是哪些。必須做<b>有校正的事後比較</b>。直接做三次未校正的 t 檢定會讓型一錯誤膨脹到 14%。'},
  {q:'如果把 MS 組內（誤差）變大，其他不變，F 值會：',
   opts:['變大','變小','不變','無法判斷'],a:1,
   why:'F = MS組間 / MS組內，分母變大 F 就變小。這也解釋了為什麼<b>降低測量誤差、控制無關變異</b>和增加樣本數一樣能提高檢定力。'}]},

/* ============ 11 ============ */
{id:11,part:2,title:'二因子變異數分析與交互作用',lede:'兩個自變項一起看，除了各自的效果，還多出一個只有多因子設計才問得到的問題：一個因子的效果會不會隨另一個因子改變？',
 mins:18,goals:['主要效果','交互作用','重複量數'],body:[
 H('一次得到三個檢定'),
 P('把 <code>group</code>（3 水準）和 <code>sex</code>（2 水準）放在一起，形成 3 × 2 設計，共 6 個細格。這時候會得到三個 F：'),
 UL(['<b>group 的主要效果</b>：不分性別，三組的記憶分數有沒有差？',
   '<b>sex 的主要效果</b>：不分組別，男女有沒有差？',
   '<b>group × sex 交互作用</b>：睡眠介入的效果，男女是不是不一樣？']),
 NOTE('key','交互作用才是多因子設計的價值','如果你只想知道兩個主要效果，跑兩次單因子就好了。做二因子的理由幾乎總是為了那個交互作用——它回答的是<b>「這個效果對誰有效？」</b>，而這正是心理學最常問的問題。'),
 H('親手拉出一個交互作用'),
 P('拖動任何一個點，看下方的三個 F 值怎麼變。試著把兩條線拉成平行（交互作用消失），再把它們拉成交叉（強交互作用）。'),
 SIM('inter'),
 H('三種典型的圖形'),
 TBL(['圖形','意義','怎麼報告'],[
  ['兩條線<b>平行</b>','沒有交互作用','直接解釋兩個主要效果'],
  ['兩條線<b>不平行但不相交</b>','次序性交互作用 (ordinal)','效果方向一致但強度不同；主要效果還可以談，但要加但書'],
  ['兩條線<b>交叉</b>','非次序性交互作用 (disordinal)','效果方向相反；此時<b>主要效果不該單獨解釋</b>，因為它是兩個相反效果的平均']],'表 14　交互作用圖的三種長相'),
 H('本課程資料的結果'),
 OUT('anova2'),
 H('顯著的交互作用之後做什麼'),
 P('做<b>單純主要效果分析 (simple main effects)</b>：固定一個因子的水準，在裡面分析另一個因子。例如「只看男生，三組有沒有差？」「只看女生，三組有沒有差？」——然後就能說出「睡眠限制對男生的傷害比女生大」這種話。'),
 OL(['SPSS：用 <code>/EMMEANS=TABLES(group*sex) COMPARE(group) ADJ(BONFERRONI)</code>。',
   'JASP：Post Hoc 面板把 <code>group ✻ sex</code> 移到右邊；或用 <b>Simple Main Effects</b> 面板，Simple effect factor 設 group、Moderator factor 設 sex。',
   'Excel：只能自己把資料分成兩份，各跑一次單因子 ANOVA，再手動做 Bonferroni 校正。']),
 H('重複量數變異數分析'),
 P('如果同一批人被測量三次以上（前測、後測、追蹤），那是<b>重複量數</b>設計，不能用一般的 ANOVA。'),
 UL(['多出一個前提：<b>球形性 (sphericity)</b>——各組差異分數的變異數要相等。用 <b>Mauchly 檢定</b>。',
   'Mauchly 顯著（違反球形性）時，用 <b>Greenhouse-Geisser</b> 校正自由度（保守）或 <b>Huynh-Feldt</b>（較寬鬆）。實務建議：ε &lt; .75 用 GG，否則用 HF。',
   '報告時自由度會變成小數，例如 <i>F</i>(1.62, 95.4) = 8.31。這是校正過的證據，不是打錯。',
   '同時有受試者間與受試者內因子的設計叫<b>混合設計 (mixed design)</b>，例如「三組 × 前後測」，這是心理學介入研究最常見的分析。']),
 SOFT({excel:[['path','資料 › 資料分析 › <b>雙因子變異數分析：重複試驗</b>'],
   ['ol',['「重複試驗」指的是每個細格有多筆資料（不是重複量數！名稱很容易誤導）。',
    '資料要排成<b>矩陣</b>：最左欄是因子 A 的水準標籤，最上列是因子 B 的水準標籤，中間填分數。',
    '「每一樣本的列數」填每個細格的人數（本例是 10）。']],
   ['p','輸出會給「樣本」（A 的效果）、「欄」（B 的效果）、「交互作用」三列的 F 與 p。'],
   ['h','限制'],
   ['ul',['要求每個細格人數<b>完全相等</b>，不平衡就不能用。',
    '沒有事後比較，沒有效果量，沒有交互作用圖。',
    '沒有重複量數變異數分析。']],
   ['p','二因子以上的分析，Excel 已經明顯不夠用了，建議改用 JASP。']],
  jasp:[['h','二因子'],
   ['path','<b>ANOVA</b> › <b>ANOVA</b> › Fixed Factors 放入<b>兩個</b>因子'],
   ['ol',['JASP 自動把兩個主要效果與交互作用都放進 Model。',
    'Display 勾 <b>partial η²</b>（多因子設計的標準效果量）。',
    '<b>Descriptives Plots</b>：Horizontal axis 放 group，<b>Separate lines</b> 放 sex → 這就是交互作用圖。',
    '<b>Simple Main Effects</b> 面板：Simple effect factor 放 group，Moderator factor 1 放 sex。',
    'Post Hoc Tests 可以把 <code>group ✻ sex</code> 整個移進去做全部細格的兩兩比較（記得校正）。']],
   ['h','重複量數'],
   ['path','<b>ANOVA</b> › <b>Repeated Measures ANOVA</b>'],
   ['ol',['先在 <b>Repeated Measures Factors</b> 命名受試者內因子（例如 time）與它的水準（pre、post）。',
    '把對應的欄位拉進 <b>Repeated Measures Cells</b>。',
    '受試者間因子（group）放 <b>Between Subject Factors</b> → 這就是混合設計。',
    'Assumption Checks 勾 <b>Sphericity tests</b>，主面板的 Sphericity corrections 勾 Greenhouse-Geisser。']]],
  spss:[['h','二因子'],
   ['path','分析 › 一般線性模式 › <b>單變量</b>（Univariate）'],
   ['ol',['依變數放 mem，固定因子放 group 與 sex。',
    '<b>圖形</b>：水平軸 group、單獨的線 sex › 按「新增」 → 交互作用圖。',
    '<b>選項</b>（或 EM 平均數）：把 group*sex 移到「顯示平均數」，勾「比較主效應」，信賴區間調整選 Bonferroni。',
    '<b>選項</b>：勾「效果大小估計值」與「同質性檢定」。']],
   ['code','UNIANOVA mem BY group sex\n  /PLOT=PROFILE(group*sex) TYPE=LINE ERRORBAR=CI\n  /EMMEANS=TABLES(group*sex) COMPARE(group) ADJ(BONFERRONI)\n  /PRINT=ETASQ HOMOGENEITY DESCRIPTIVE\n  /DESIGN=group sex group*sex.'],
   ['h','重複量數'],
   ['path','分析 › 一般線性模式 › <b>重複量數</b>'],
   ['ol',['先定義受試者內因子名稱與水準數 → 按「定義」。',
    '把 pre、post 依序指派到水準 1、2。',
    '受試者間因子放 group。',
    '輸出先看 <b>Mauchly 球形檢定</b>，再決定讀「假設球形」還是 <b>Greenhouse-Geisser</b> 那一列。']],
   ['code','GLM pre post BY group\n  /WSFACTOR=time 2 POLYNOMIAL\n  /PLOT=PROFILE(time*group)\n  /EMMEANS=TABLES(time*group)\n  /PRINT=ETASQ DESCRIPTIVE\n  /WSDESIGN=time /DESIGN=group.']]}),
 ],
 quiz:[
  {q:'二因子變異數分析中，交互作用達顯著且兩條線交叉。最適當的報告方式是：',
   opts:['先解釋兩個主要效果，再提交互作用','不解釋主要效果，直接做單純主要效果分析','只報告交互作用的 F 值','改做兩次單因子變異數分析'],a:1,
   why:'線交叉（非次序性交互作用）代表效果<b>方向相反</b>，此時主要效果是兩個相反效果的平均，解釋它會誤導讀者。正確做法是做單純主要效果分析，分別描述每個水準內的情況。'},
  {q:'重複量數變異數分析中 Mauchly 檢定 p = .01，應該：',
   opts:['放棄分析','讀「假設球形」那一列','讀 Greenhouse-Geisser 校正過的那一列','改用獨立樣本設計'],a:2,
   why:'Mauchly 顯著代表<b>違反球形性假設</b>，直接讀未校正的 F 會膨脹型一錯誤。改讀 Greenhouse-Geisser（或 Huynh-Feldt）校正列，自由度會變成小數。'},
  {q:'3（組別）× 2（性別）設計，每格 10 人。交互作用的自由度是：',
   opts:['(2, 54)','(1, 54)','(2, 57)','(5, 54)'],a:0,
   why:'交互作用 df = (3−1) × (2−1) = 2；誤差 df = N − 細格數 = 60 − 6 = 54。所以是 <i>F</i>(2, 54)。'}]},

/* ============ 12 ============ */
{id:12,part:3,title:'卡方檢定',lede:'前面所有檢定的依變項都是數量變項。當你的結果變項是「類別」——通過／不通過、有／沒有——就輪到卡方上場。',
 mins:16,goals:['適合度檢定','獨立性檢定','期望次數'],body:[
 H('兩種卡方，同一個公式'),
 FML('<i>χ</i><sup>2</sup> = Σ <span class="frac"><span class="n">(<i>O</i> − <i>E</i>)<sup>2</sup></span><span class="d"><i>E</i></span></span>','觀察次數與期望次數差多少，除以期望次數'),
 UL(['<b>適合度檢定 (goodness of fit)</b>：一個類別變項。觀察到的分布符合某個理論比例嗎？例如「四個選項被選的次數是均勻的嗎」。<i>df</i> = 類別數 − 1。',
   '<b>獨立性檢定 (test of independence)</b>：兩個類別變項。它們有沒有關聯？例如「組別和是否達標有關嗎」。<i>df</i> = (列數 − 1)(欄數 − 1)。']),
 H('期望次數怎麼來'),
 P('獨立性檢定的期望次數，是「假設兩個變項完全無關」時該有的樣子：'),
 FML('<i>E</i><sub><i>ij</i></sub> = <span class="frac"><span class="n">列總和 × 欄總和</span><span class="d">總人數</span></span>','在無關的世界裡，每格應該有幾個人'),
 P('下面的表格可以直接編輯。改任何一格的次數，看期望次數、χ²、p 值怎麼跟著變。'),
 SIM('chisq'),
 H('本課程資料的結果'),
 P('把記憶測驗 40 分當作「達標」，看三個組的達標率有沒有差異。'),
 OUT('chisq'),
 NOTE('warn','期望次數的規則','卡方的 p 值是<b>近似</b>值，期望次數太小時近似會失準。通用準則：<b>所有期望次數都要 ≥ 5</b>（寬鬆版：不超過 20% 的格子小於 5，且沒有任何一格小於 1）。注意看的是<b>期望</b>次數，不是觀察次數——觀察到 0 個人本身沒問題。違反時的作法：合併類別，或改用 <b>Fisher 精確檢定</b>。'),
 H('2×2 表的特殊規則'),
 UL(['<b>Yates 連續性校正</b>：2×2 表且 n 較小時，SPSS 會自動給一列「連續性校正」。它比較保守，近年被認為<b>過度保守</b>，一般建議在 n ≥ 40 且期望次數都 ≥ 5 時讀未校正的 Pearson 卡方。',
   '<b>Fisher 精確檢定</b>：期望次數不足時的正解，SPSS 對 2×2 表會自動附上。',
   '<b>效果量</b>：2×2 用 <b>φ (phi)</b>，大於 2×2 用 <b>Cramér\'s V</b>。兩者都介於 0 到 1。']),
 H('配對的類別資料'),
 P('如果同一批人被測量兩次（治療前後都問「有沒有失眠」），觀察值不獨立，不能用一般卡方。要用 <b>McNemar 檢定</b>。SPSS：無母數檢定 › 二個相關樣本 › 勾 McNemar；JASP：Frequencies › <b>McNemar Test</b>。'),
 SOFT({excel:[['h','只回傳 p 值的捷徑'],
   ['code','=CHISQ.TEST(觀察次數範圍, 期望次數範圍)   &lt;- 直接給 p'],
   ['p','必須自己先算好期望次數的範圍，而且它<b>不回傳 χ² 與 df</b>。'],
   ['h','自己算完整結果'],
   ['ol',['用 <code>COUNTIFS</code> 做出列聯表：<code>=COUNTIFS($B$2:$B$61,0,$H$2:$H$61,1)</code>',
    '算列總和、欄總和、總人數。',
    '每格期望次數：<code>=列總和*欄總和/總人數</code>',
    '每格貢獻：<code>=(O-E)^2/E</code>，全部加總得 χ²。',
    'p 值：<code>=CHISQ.DIST.RT(chi2, df)</code>']],
   ['h','Cramér\'s V'],
   ['code','=SQRT(chi2 / (n * MIN(列數-1, 欄數-1)))'],
   ['h','樞紐分析表最快'],
   ['path','插入 › 樞紐分析表 › 列放 group、欄放 pass、值放「計數」']],
  jasp:[['path','<b>Frequencies</b> › <b>Contingency Tables</b>'],
   ['ol',['<code>group</code> 拉進 <b>Rows</b>，<code>pass</code> 拉進 <b>Columns</b>。',
    '（若資料已經是次數表格式，把次數那一欄拉進 <b>Counts</b>。）',
    '<b>Statistics</b> 面板：勾 <b>χ²</b>、<b>Phi and Cramér\'s V</b>；2×2 表再勾 <b>χ² continuity correction</b> 與 <b>Fisher\'s exact test</b>。',
    '<b>Cells</b> 面板：勾 <b>Expected</b>（一定要看期望次數）、<b>Row</b> 百分比（方便解讀）。']],
   ['h','適合度檢定'],
   ['path','<b>Frequencies</b> › <b>Multinomial Test</b>'],
   ['p','把類別變項拉進 Factor，Expected Proportions 可以設成 equal 或自訂比例。'],
   ['h','配對資料'],
   ['path','<b>Frequencies</b> › <b>McNemar Test</b>']],
  spss:[['h','獨立性檢定'],
   ['path','分析 › 敘述統計 › <b>交叉表</b>'],
   ['ol',['列放 group，欄放 pass。',
    '<b>統計量</b>：勾「卡方」「Phi 與 Cramer\'s V」。',
    '<b>儲存格</b>：勾「觀察值」「<b>期望</b>」「列」百分比。']],
   ['h','適合度檢定'],
   ['path','分析 › 無母數檢定 › 舊式對話框 › <b>卡方</b>'],
   ['h','語法'],
   ['code','CROSSTABS /TABLES=group BY pass\n  /STATISTICS=CHISQ PHI\n  /CELLS=COUNT EXPECTED ROW\n  /COUNT ROUND CASE.\n\nNPAR TESTS /CHISQUARE=choice /EXPECTED=EQUAL.'],
   ['h','資料已經是次數表怎麼辦'],
   ['p','建一個 count 欄位，然後用<b>加權觀察值</b>：'],
   ['code','WEIGHT BY count.\nCROSSTABS /TABLES=row BY col /STATISTICS=CHISQ.\nWEIGHT OFF.'],
   ['p','⚠️ 分析完記得 <code>WEIGHT OFF.</code>，否則後面所有分析的 n 都會是錯的。SPSS 表格下方會有一行小字提醒你期望次數小於 5 的格子有幾個——那行一定要看。']]}),
 ],
 quiz:[
  {q:'3 × 4 的列聯表，卡方檢定的自由度是：',
   opts:['12','7','6','11'],a:2,
   why:'df = (列數 − 1)(欄數 − 1) = (3 − 1)(4 − 1) = <b>6</b>。注意卡方的 df 和樣本數無關，只和表格的形狀有關。'},
  {q:'2 × 2 表中，某格的觀察次數是 0，期望次數是 8。這代表：',
   opts:['違反期望次數假設，要用 Fisher 精確檢定','沒有問題，期望次數都 ≥ 5','必須合併類別','卡方值一定不顯著'],a:1,
   why:'假設檢查的是<b>期望</b>次數（都要 ≥ 5），不是觀察次數。觀察到 0 反而是很強的訊號，通常會讓 χ² 變大。'},
  {q:'研究者測量 50 位受試者治療前後「是否有失眠」，想檢定比例是否改變。應該用：',
   opts:['Pearson 卡方獨立性檢定','卡方適合度檢定','McNemar 檢定','Cramér\'s V'],a:2,
   why:'同一批人測兩次 → 資料<b>配對</b>，違反卡方的獨立性假設。類別資料的配對版本就是 <b>McNemar 檢定</b>（相當於類別版的成對 t 檢定）。'}]},

/* ============ 13 ============ */
{id:13,part:3,title:'相關',lede:'兩個數量變項一起變動的程度。r 這個數字很好算，但關於它的誤解大概是統計學裡最多的。',
 mins:16,goals:['Pearson r','r 的限制','相關≠因果'],body:[
 H('r 在量什麼'),
 P('Pearson 相關係數是<b>兩個變項 z 分數乘積的平均</b>。它介於 −1 到 +1，符號表示方向，絕對值表示強度。因為用的是 z 分數，所以 r 完全不受單位影響——用小時或分鐘算睡眠，r 一模一樣。'),
 FML('<i>r</i> = <span class="frac"><span class="n">Σ(<i>z<sub>X</sub></i> × <i>z<sub>Y</sub></i>)</span><span class="d"><i>n</i> − 1</span></span>','兩個變項一起偏離平均的程度'),
 P('拖動下面散布圖裡的任何一個點，或按「猜猜看」測試自己的眼力。多玩幾次，你會對 r = .3 和 r = .7 長什麼樣子有直覺——這比記公式有用得多。'),
 SIM('corr'),
 H('r² ：共同變異的比例'),
 P('<b><i>r</i><sup>2</sup>（決定係數）比 r 本身好解讀。</b>r = .30 聽起來不小，但 r² = .09——只解釋了 9% 的變異，還有 91% 沒解釋到。r = .70 → r² = .49，接近一半。'),
 H('本課程資料的相關矩陣'),
 OUT('corr'),
 H('r 的五個陷阱'),
 TBL(['陷阱','會怎樣','怎麼防'],[
  ['<b>只抓直線關係</b>','U 型關係（如喚起程度與表現）的 r 可能接近 0','一定要先畫散布圖'],
  ['<b>離群值主導</b>','單一個點可以把 r 從 .1 拉到 .8','畫圖；或改用 Spearman'],
  ['<b>全距限縮</b>','只收高分群（如只研究資優生）會讓 r 大幅低估','注意樣本的變異範圍'],
  ['<b>組合效果 / 辛普森悖論</b>','各組內是負相關，合起來卻變正相關','用顏色標示分組再看一次'],
  ['<b>相關 ≠ 因果</b>','可能反向、可能有第三變項','除非做實驗操弄，否則只能說「有關聯」']],'表 15　看到 r 之前要先想的五件事'),
 NOTE('trap','本課程資料就是一個例子','睡眠時數與記憶分數 <i>r</i> = .71，非常強。但這份資料裡睡眠是<b>被隨機分派操弄的</b>（三個介入組），所以我們才有底氣談因果。如果只是問卷調查「你睡幾小時、你記憶多好」，同樣的 r = .71 就只能說「有關聯」——可能是記憶好的人壓力小所以睡得好，也可能兩者都被「用功程度」影響。<b>能不能談因果，取決於研究設計，不是取決於 r 有多大。</b>'),
 H('Spearman 等級相關'),
 P('把兩個變項各自轉成<b>名次</b>，再對名次算 Pearson。適用於：次序尺度資料、有嚴重離群值、關係單調但非線性。本課程資料 sleep 與 mem 的 Spearman ρ = .705，和 Pearson 的 .712 很接近，代表關係大致線性、沒有被離群值扭曲——這個比較本身就是一種穩健性檢查。'),
 SOFT({excel:[['h','兩變項'],
   ['code','=CORREL(D2:D61, E2:E61)      &lt;- Pearson r\n=PEARSON(D2:D61, E2:E61)     &lt;- 完全一樣的東西\n=RSQ(D2:D61, E2:E61)         &lt;- r²'],
   ['h','顯著性（Excel 不給，要自己算）'],
   ['code','t = r * SQRT((n-2)/(1-r^2))\np = T.DIST.2T(ABS(t), n-2)'],
   ['h','相關矩陣'],
   ['path','資料 › 資料分析 › <b>相關係數</b> ›「輸入範圍」框住所有變項欄'],
   ['p','⚠️ 只給下三角矩陣，<b>沒有 p 值也沒有 n</b>。要報告的話得自己補。'],
   ['h','Spearman'],
   ['code','先用 =RANK.AVG(D2, $D$2:$D$61, 1) 把兩欄各自轉成名次，\n再對兩欄名次用 =CORREL(...)'],
   ['h','散布圖'],
   ['path','選兩欄 › 插入 › 散布圖 › 點資料點 › 右鍵 › <b>加上趨勢線</b> › 勾「顯示公式」「顯示 R 平方值」']],
  jasp:[['path','<b>Regression</b> › <b>Correlation</b>'],
   ['ol',['把所有要看的變項一起拉進去，會得到完整的相關矩陣。',
    'Sample Correlation Coefficient 勾 <b>Pearson</b>、<b>Spearman</b>（想一起看就都勾）。',
    'Additional Options 勾 <b>Display pairwise table</b>（轉成長條式表格，比較好貼進論文）、<b>Report significance</b>、<b>Confidence intervals</b>。',
    '<b>Plots</b> 勾 <b>Scatter plots</b> → JASP 會畫出矩陣圖：對角線是各變項的分配，下三角是散布圖加迴歸線。這張圖一次檢查完線性、離群值、分配形狀。']],
   ['p','JASP 的相關矩陣圖是三套軟體裡最好用的探索工具，做任何相關或迴歸之前先看它。']],
  spss:[['path','分析 › 相關 › <b>雙變異數</b>（Bivariate）'],
   ['ol',['把變項全部移進「變數」框。',
    '相關係數勾 <b>Pearson</b>（要等級相關就勾 <b>Spearman</b>）。',
    '顯著性檢定選「雙尾」。',
    '勾「<b>以星號標示顯著相關</b>」。',
    '<b>選項</b> › 勾「平均數與標準差」。']],
   ['code','CORRELATIONS\n  /VARIABLES=sleep phone mem pre post\n  /PRINT=TWOTAIL NOSIG\n  /STATISTICS DESCRIPTIVES\n  /MISSING=PAIRWISE.\n\nNONPAR CORR /VARIABLES=sleep mem /PRINT=SPEARMAN TWOTAIL NOSIG.'],
   ['h','⚠️ PAIRWISE 還是 LISTWISE'],
   ['p','<code>PAIRWISE</code>（預設）每一對相關各自用能用的資料，所以矩陣裡每格的 <b>n 可能不一樣</b>；<code>LISTWISE</code> 只留所有變項都完整的受試者，n 一致但可能損失很多資料。報告時務必說明你用哪一種。'],
   ['h','散布圖'],
   ['path','圖形 › 圖表建立器 › Scatter/Dot › 簡單散布圖；或 <b>矩陣散布圖</b>一次看全部']]}),
 ],
 quiz:[
  {q:'r = .40 代表可以解釋依變項多少百分比的變異？',
   opts:['40%','20%','16%','60%'],a:2,
   why:'r² = .40² = .16 = <b>16%</b>。這是 r 最容易被高估的地方：r = .40 聽起來「中等偏強」，但還有 84% 的變異沒被解釋。'},
  {q:'散布圖呈現明顯的倒 U 型（中等喚起時表現最好），Pearson r 最可能接近：',
   opts:['+1','−1','0','無法計算'],a:2,
   why:'Pearson r 只偵測<b>線性</b>關係。倒 U 型的左半邊是正斜率、右半邊是負斜率，兩者互相抵消，r 會接近 0——但關係其實非常強。這正是「一定要畫圖」的最佳範例。'},
  {q:'研究發現「冰淇淋銷量」與「溺水人數」r = .82。最合理的解釋是：',
   opts:['吃冰淇淋會增加溺水風險','溺水事件促使人們買冰淇淋','存在第三變項（氣溫）同時影響兩者','這是統計誤差'],a:2,
   why:'典型的<b>混淆變項</b>：天氣熱既讓人買冰淇淋，也讓人去游泳。相關只描述共變，因果推論需要實驗操弄、時間順序與排除其他解釋。'}]},

/* ============ 14 ============ */
{id:14,part:3,title:'迴歸分析',lede:'相關問「有沒有關係」，迴歸問「關係有多大、能不能預測、控制住別的變項之後還在不在」。',
 mins:20,goals:['最小平方法','解讀係數','多元迴歸'],body:[
 H('最小平方法：為什麼是「那一條」線'),
 P('無限多條線可以穿過一團點。最小平方法挑的是<b>殘差平方和最小</b>的那一條。殘差 = 實際值 − 預測值，也就是點到線的垂直距離。'),
 FML('<i>Ŷ</i> = <i>a</i> + <i>bX</i>　　min Σ(<i>Y</i> − <i>Ŷ</i>)<sup>2</sup>','找到讓誤差平方和最小的 a 與 b'),
 P('下面你可以自己拖曳那條線。試著把殘差平方和（右邊的紅色數字）壓到最小，然後按「顯示最小平方解」看你離最佳解有多遠。'),
 SIM('reg'),
 H('怎麼解讀係數'),
 UL(['<b>斜率 b</b>：X 每增加 1 個單位，Y 平均改變多少。單位是「Y 的單位 ÷ X 的單位」。',
   '<b>截距 a</b>：X = 0 時的預測值。<b>很多時候沒有實質意義</b>（睡 0 小時的人的記憶分數？），只是數學上的定位點。',
   '<b>標準化係數 β</b>：把所有變項轉成 z 分數後的斜率。單位被消掉了，所以可以比較不同預測變項的相對重要性。單一預測變項時 β 就等於 r。',
   '<b>R²</b>：模型解釋了依變項多少比例的變異。',
   '<b>調整後 R²</b>：加入預測變項一定會讓 R² 上升（即使是隨機變項），調整後 R² 把這個灌水扣掉。<b>多元迴歸要報這個。</b>']),
 H('簡單迴歸：用睡眠預測記憶'),
 OUT('reg1'),
 H('多元迴歸：同時放進睡眠與手機使用'),
 P('多元迴歸的關鍵字是<b>「控制住其他變項之後」</b>。每個係數的意思是：在其他預測變項保持不變的情況下，這個變項的獨特貢獻。'),
 OUT('reg2'),
 NOTE('key','注意係數怎麼變','簡單迴歸裡睡眠的斜率是 4.22，放進手機使用之後降到 3.76。因為睡眠和手機使用本身有負相關（<i>r</i> = −.31），簡單迴歸裡睡眠的係數其實「代打」了一部分手機使用的效果。這就是為什麼<b>多元迴歸的係數不能用簡單相關去猜</b>。'),
 H('迴歸的五個前提（縮寫 LINE + 獨立）'),
 TBL(['前提','怎麼檢查','違反了怎麼辦'],[
  ['<b>線性 L</b>','殘差 vs 預測值圖應無曲線趨勢','加入平方項，或轉換變項'],
  ['<b>獨立性 I</b>','Durbin-Watson 接近 2（時間序列才重要）','改用混合模型／時間序列模型'],
  ['<b>常態性 N</b>','殘差的 Q-Q 圖接近直線','大樣本時穩健；或做轉換'],
  ['<b>變異數齊一 E</b>','殘差圖呈水平帶狀，不是喇叭形','穩健標準誤，或轉換依變項'],
  ['<b>沒有多元共線性</b>','VIF &lt; 10（保守 &lt; 5），容忍度 &gt; .1','刪除或合併高度相關的預測變項']],'表 16　迴歸的前提與診斷'),
 NOTE('warn','殘差圖是迴歸的體檢報告','檢查前提幾乎全靠<b>殘差 vs 預測值</b>這一張圖。理想長相是一團沒有結構的雲。喇叭形 → 變異數不齊一；曲線 → 非線性；遠離群體的點 → 離群值或高影響點。第 15 關會專門處理。'),
 SOFT({excel:[['h','單一係數'],
   ['code','=SLOPE(Y範圍, X範圍)        &lt;- 斜率 b\n=INTERCEPT(Y範圍, X範圍)    &lt;- 截距 a\n=RSQ(Y範圍, X範圍)          &lt;- R²\n=STEYX(Y範圍, X範圍)        &lt;- 估計標準誤\n=FORECAST.LINEAR(7.5, Y範圍, X範圍)  &lt;- 預測 sleep=7.5 時的 mem'],
   ['h','完整輸出：分析工具箱'],
   ['path','資料 › 資料分析 › <b>迴歸</b>'],
   ['ol',['「輸入 Y 範圍」放依變項，「輸入 X 範圍」放<b>一欄或多欄相鄰</b>的預測變項。',
    '勾「標記」（若含標題列）、「殘差」、「殘差圖」、「常態機率圖」。',
    '輸出包含 R、R²、調整後 R²、ANOVA 表、每個係數的估計值／標準誤／t／p／95% CI。']],
   ['p','這是 Excel 統計功能裡最完整的一個，輸出格式和 SPSS 幾乎一一對應，很適合拿來對照學習。'],
   ['h','限制'],
   ['ul',['預測變項必須放在<b>相鄰的欄</b>，不能跳著選。','沒有標準化係數 β，沒有 VIF。','沒有階層迴歸。']]],
  jasp:[['path','<b>Regression</b> › <b>Linear Regression</b>'],
   ['ol',['依變項拉進 <b>Dependent Variable</b>，預測變項拉進 <b>Covariates</b>（類別預測變項放 Factors）。',
    '<b>Model</b> 面板可以建立多個 Block → 這就是<b>階層迴歸</b>，會給每一步的 ΔR² 與 F change。',
    '<b>Statistics</b> 面板：勾 Estimates、<b>Standardized</b>（得到 β）、Confidence intervals、Model fit、<b>Collinearity diagnostics</b>（VIF）、Durbin-Watson。',
    '<b>Plots</b> 面板：勾 <b>Residuals vs. Predicted</b>、<b>Q-Q plot standardized residuals</b>、Residuals histogram。',
    'Method 保持 <b>Enter</b>（全部同時放入）。除非有強理由，不要用 Stepwise。']],
   ['p','JASP 的 Model Summary 表會把每個 Block 列成一行，ΔR² 直接顯示——做階層迴歸比 SPSS 直觀很多。']],
  spss:[['path','分析 › 迴歸 › <b>線性</b>'],
   ['ol',['依變數放 mem，自變數放 sleep 與 phone。',
    '想做<b>階層迴歸</b>：先放第一組變項 → 按「<b>下一個</b>」→ 放第二組。',
    '<b>統計量</b>：勾「估計值」「信賴區間」「模式適合度」「<b>R 平方改變量</b>」「<b>共線性診斷</b>」「Durbin-Watson」「描述性統計量」。',
    '<b>圖形</b>：Y 軸放 <code>*ZRESID</code>、X 軸放 <code>*ZPRED</code>；勾「常態機率圖」。',
    '<b>儲存</b>：可以把標準化殘差、Cook 距離、槓桿值存成新欄位。']],
   ['code','REGRESSION\n  /STATISTICS COEFF OUTS CI(95) R ANOVA CHANGE COLLIN TOL\n  /DEPENDENT mem\n  /METHOD=ENTER sleep\n  /METHOD=ENTER phone\n  /SCATTERPLOT=(*ZRESID ,*ZPRED)\n  /RESIDUALS DURBIN NORMPROB(ZRESID)\n  /SAVE ZRESID COOK LEVER.'],
   ['h','讀輸出的順序'],
   ['ol',['<b>模式摘要</b>：R²、調整後 R²、R 平方改變量。',
    '<b>ANOVA 表</b>：整個模型是否顯著。',
    '<b>係數表</b>：B（未標準化）、Beta（標準化）、t、顯著性、VIF。',
    '<b>殘差圖與常態 P-P 圖</b>：檢查前提。']]]}),
 ],
 quiz:[
  {q:'迴歸式 Ŷ = 8.95 + 4.22X（X = 睡眠時數，Y = 記憶分數）。斜率 4.22 的正確解讀是：',
   opts:['睡眠解釋了 4.22% 的記憶變異','每多睡 1 小時，記憶分數平均高 4.22 分','記憶分數是睡眠時數的 4.22 倍','睡眠與記憶的相關是 .422'],a:1,
   why:'斜率就是「X 每增加一單位，Y 平均改變多少」。解釋變異比例的是 R²，相關強度是 r——三個東西不要混。'},
  {q:'多元迴歸中，某預測變項的 VIF = 12。這代表：',
   opts:['該變項效果很強','存在嚴重多元共線性','樣本數不足','該變項應該取對數'],a:1,
   why:'VIF 衡量該變項被<b>其他預測變項</b>解釋的程度。VIF > 10（保守用 5）代表嚴重共線性：係數估計會非常不穩定，正負號甚至可能翻轉。處理方式是刪除、合併，或改用主成分／脊迴歸。'},
  {q:'加入一個完全隨機的變項到多元迴歸中，R² 與調整後 R² 會怎麼變？',
   opts:['兩者都上升','兩者都下降','R² 上升或不變，調整後 R² 可能下降','兩者都不變'],a:2,
   why:'R² 在加入任何變項後都<b>不會下降</b>——這是它的數學性質，所以會被灌水。調整後 R² 對增加的參數數量罰分，加入無用變項時會<b>下降</b>。這就是多元迴歸要報調整後 R² 的原因。'}]},

/* ============ 15 ============ */
{id:15,part:4,title:'前提檢查與無母數替代',lede:'每個參數檢定都建立在假設上。這一關教你怎麼檢查它們，以及被違反時該換成什麼。',
 mins:16,goals:['常態性','變異數同質','無母數方法'],body:[
 H('三個核心假設，重要性依序'),
 OL(['<b>獨立性</b>：最重要，也最無法用統計方法補救。它是研究設計的問題：同班同學互相討論、同一位受試者提供多筆資料、班級／學校的巢狀結構——這些都會違反獨立性，膨脹型一錯誤。解法是多層次模型 (HLM／混合模型)，不是換一個檢定。',
   '<b>常態性</b>：指的是<b>誤差（殘差）</b>常態，不是原始資料常態。因為中央極限定理，n 夠大時相當穩健。',
   '<b>變異數同質</b>：組間人數相等時很穩健；人數不等時影響大。']),
 H('怎麼檢查常態性'),
 SIM('diag'),
 TBL(['方法','優點','缺點'],[
  ['<b>Q-Q 圖</b>','直接看偏離的形狀與位置','要練習才看得懂'],
  ['<b>直方圖 + 常態曲線</b>','直觀','受組距影響'],
  ['<b>偏態／峰度</b>','有數字可報告','沒有明確判準'],
  ['<b>Shapiro-Wilk 檢定</b>','有 p 值','<span style="color:var(--bad)">樣本大就一定顯著</span>'],
  ['<b>Kolmogorov-Smirnov</b>','傳統常見','檢定力低，已不建議單用']],'表 17　常態性的檢查方式'),
 NOTE('trap','不要被常態性檢定牽著走','Shapiro-Wilk 的檢定力隨 n 增加。n = 1000 時，一個微不足道的偏離也會 p &lt; .001；n = 15 時，明顯偏斜的資料也可能不顯著——結論剛好和你需要的相反。<b>實務建議：以 Q-Q 圖與偏態峰度為主，常態性檢定只當輔助。</b>而且 n 大時參數檢定本來就穩健，正是最不需要擔心的情況。'),
 H('怎麼讀 Q-Q 圖'),
 UL(['點沿著對角線 → 近似常態。',
   '兩端往上翹、中間貼線 → <b>厚尾</b>（峰度高，離群值多）。',
   '呈現向上的弧形 → <b>右偏</b>；向下的弧形 → 左偏。',
   '中間有階梯狀 → 資料有大量重複值（例如李克特單題）。']),
 H('變異數同質'),
 P('<b>Levene 檢定</b>是最常用的：它對每個人算「離自己組中位數的絕對距離」，再對這些距離做 ANOVA。顯著代表變異數不同質。'),
 UL(['<b>獨立樣本 t</b> 不同質 → 用 <b>Welch</b>（或一律用 Welch）。',
   '<b>單因子 ANOVA</b> 不同質 → 用 <b>Welch\'s ANOVA</b> + <b>Games-Howell</b> 事後比較。',
   '<b>迴歸</b> 不同質（異質變異）→ 用穩健標準誤，或轉換依變項。']),
 H('資料轉換'),
 TBL(['問題','轉換','注意'],[
